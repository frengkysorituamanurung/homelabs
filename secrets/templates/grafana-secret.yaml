# ExternalSecret untuk Grafana admin credentials
# Prerequisites:
#   1. ClusterSecretStore 'vault-backend' sudah apply dan READY
#   2. Secret sudah ada di Vault:
#      kubectl exec -n vault -it vault-0 -- vault kv put secret/grafana \
#        adminUser=admin adminPassword=<PASSWORD>
#
# Setelah ExternalSecret dibuat, update grafana values.yaml:
#   admin.existingSecret: grafana-admin-secret
#   admin.userKey: admin-user
#   admin.passwordKey: admin-password
#
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: secret/data/grafana
        property: adminUser
    - secretKey: admin-password
      remoteRef:
        key: secret/data/grafana
        property: adminPassword
