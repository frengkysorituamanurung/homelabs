# ExternalSecret untuk sandbox-finance database credentials
# Prerequisites:
#   1. ClusterSecretStore 'vault-backend' sudah apply dan READY
#   2. Secret sudah ada di Vault:
#      kubectl exec -n vault -it vault-0 -- vault kv put secret/sandbox-finance \
#        username=sandbox_user password=<PASSWORD>

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sandbox-finance-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: sandbox-finance-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/sandbox-finance
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/sandbox-finance
        property: password
