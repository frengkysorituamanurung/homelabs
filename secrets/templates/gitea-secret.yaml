# ExternalSecret untuk Gitea admin credentials
# Prerequisites:
#   1. ClusterSecretStore 'vault-backend' sudah apply dan READY
#   2. Secret sudah ada di Vault:
#      kubectl exec -n vault -it vault-0 -- vault kv put secret/gitea \
#        adminPassword=<PASSWORD>
#
# Setelah ExternalSecret dibuat, update gitea values.yaml:
#   gitea.admin.existingSecret: gitea-admin-secret
#
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-admin-secret
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: gitea-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/gitea
        property: adminPassword
