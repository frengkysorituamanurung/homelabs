# ExternalSecret untuk OpenObserve root credentials
# Prerequisites:
#   1. ClusterSecretStore 'vault-backend' sudah apply dan READY
#   2. Secret sudah ada di Vault:
#      kubectl exec -n vault -it vault-0 -- sh -c "
#        VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=<TOKEN> \
#        vault kv put secret/openobserve \
#          rootEmail='admin@frengky.xyz' \
#          rootPassword='REPLACE_WITH_OPENOBSERVE_PASSWORD' \
#          webUrl='https://openobserve.frengky.xyz'"
#
# Setelah ExternalSecret dibuat, Kubernetes Secret 'openobserve-auth'
# akan otomatis dibuat di namespace 'openobserve' oleh ESO.
#
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-auth
  namespace: openobserve
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: openobserve-auth
    creationPolicy: Owner
  data:
    - secretKey: ZO_ROOT_USER_EMAIL
      remoteRef:
        key: secret/data/openobserve
        property: rootEmail
    - secretKey: ZO_ROOT_USER_PASSWORD
      remoteRef:
        key: secret/data/openobserve
        property: rootPassword
