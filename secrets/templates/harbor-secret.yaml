# ExternalSecret untuk Harbor admin credentials
# Prerequisites:
#   1. ClusterSecretStore 'vault-backend' sudah apply dan READY
#   2. Secret sudah ada di Vault:
#      kubectl exec -n vault -it vault-0 -- vault kv put secret/harbor \
#        adminPassword=<PASSWORD>
#
# Setelah ExternalSecret dibuat, update harbor values.yaml:
#   harborAdminPassword:  # hapus nilai ini
#   existingSecretAdminPassword: harbor-admin-secret
#   existingSecretAdminPasswordKey: adminPassword
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-admin-secret
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: adminPassword
      remoteRef:
        key: secret/data/harbor
        property: adminPassword
    - secretKey: secretKey
      remoteRef:
        key: secret/data/harbor
        property: secretKey
