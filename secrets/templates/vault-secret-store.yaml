# ClusterSecretStore - Koneksi ESO ke Vault
# Apply ini SETELAH Vault dan ESO running, dan setelah vault-token Secret dibuat:
#
#   kubectl create secret generic vault-token \
#     -n external-secrets \
#     --from-literal=token=<VAULT_TOKEN>
#
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token
