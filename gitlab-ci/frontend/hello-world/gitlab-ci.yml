stages:
  - build-and-deploy

variables:
  APP_NAME: "hello-world"
  IMAGE_REPO: "harbor-registry-tls.harbor.svc.cluster.local:443/frontend/hello-world"
  VALUES_PATH: "kubernetes/production/frontend/hello-world/values.yaml"

build-and-deploy:
  stage: build-and-deploy
  image: harbor-registry-tls.harbor.svc.cluster.local:443/library/docker:20.10.16-tools
  services:
    - name: harbor-registry-tls.harbor.svc.cluster.local:443/library/docker:20.10.16-dind
      command: ["--mtu=1450"]
  before_script:
    - echo "nameserver 10.43.0.10" > /etc/resolv.conf
    - echo "search svc.cluster.local cluster.local" >> /etc/resolv.conf
  script:
    # 2. Get the Deployment Tool scripts
    - git clone http://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab-http.gitlab.svc.cluster.local/devops/deployment-tools.git
    - cp deployment-tools/scripts/build-and-deploy.sh .
    - cp deployment-tools/scripts/argocd-sync.sh .
    - chmod +x build-and-deploy.sh argocd-sync.sh
    
    # 3. Execute the pipeline using the Vault Token
    - ./build-and-deploy.sh "$APP_NAME" "$IMAGE_REPO" "$VALUES_PATH"
