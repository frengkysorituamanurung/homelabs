# Grafana Ingress - Tailscale Only Access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-tailscale-whitelist@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.frengky.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
