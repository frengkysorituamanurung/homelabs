# =============================================================
# Traefik Middleware: Tailscale IP Whitelist
# Hanya allow akses dari Tailscale network (100.64.0.0/10)
# Semua device yang connect ke Tailscale dapat IP di range ini
# =============================================================

# Namespace: traefik (global)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailscale-whitelist
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - "100.64.0.0/10"   # Tailscale CGNAT range (semua device Tailscale)
      - "127.0.0.1/32"    # Localhost
      - "192.168.100.0/24" # Local network WSL

---
