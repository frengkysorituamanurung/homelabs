# =============================================================
# Traefik Middleware: Tailscale IP Whitelist via Cloudflare
# 
# Flow: Browser → Cloudflare Proxy → Traefik
# Cloudflare meneruskan IP asli client di X-Forwarded-For header
# Traefik (setelah trust Cloudflare IPs) akan baca IP asli client
#
# Tailscale IP range: 100.64.0.0/10 (CGNAT range)
# =============================================================

# Namespace: argocd
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailscale-whitelist
  namespace: argocd
spec:
  ipAllowList:
    sourceRange:
      - "100.64.0.0/10"      # Tailscale CGNAT range
      - "127.0.0.1/32"
      - "192.168.100.0/24"   # Local WSL network
      - "10.42.0.0/16"       # K8s pod network
    ipStrategy:
      depth: 1               # Baca IP pertama dari X-Forwarded-For (IP asli client setelah Cloudflare strip)

---
# Namespace: vault
