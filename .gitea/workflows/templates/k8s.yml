name: Reusable Build and GitOps Deploy Workflow

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
        description: "Nama aplikasi (contoh: my-frontend)"
      image_repo:
        required: true
        type: string
        description: "URL image repository di Harbor (contoh: harbor.frengky.xyz/apps/my-frontend)"
      values_path:
        required: true
        type: string
        description: "Path ke file values.yaml aplikasi di repo GitOps"
    secrets:
      harbor_username:
        required: true
      harbor_password:
        required: true
      gitops_token:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v3

      - name: Get Short SHA for Image Tag
        id: vars
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Login to Harbor
        uses: docker/login-action@v2
        with:
          registry: harbor.frengky.xyz
          username: ${{ secrets.harbor_username }}
          password: ${{ secrets.harbor_password }}

      - name: Download Deployment Tool
        # Mengambil script deployment-tool dari repo GitOps
        run: |
          wget -q https://gitea.frengky.xyz/frengky/gitops/raw/branch/main/scripts/deployment-tool.sh
          chmod +x deployment-tool.sh

      - name: Run Deployment Tool
        run: |
          ./deployment-tool.sh \
            "${{ inputs.app_name }}" \
            "${{ inputs.image_repo }}" \
            "${{ env.IMAGE_TAG }}" \
            "https://gitops-bot:${{ secrets.gitops_token }}@gitea.frengky.xyz/frengky/gitops.git" \
            "${{ inputs.values_path }}"
