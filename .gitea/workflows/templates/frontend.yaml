name: Frontend CI/CD Template

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      image_repo:
        required: true
        type: string
      values_path:
        required: true
        type: string
    secrets:
      VAULT_TOKEN:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Kubernetes DNS
        run: |
          echo "nameserver 10.43.0.10" > /etc/resolv.conf
          echo "search svc.cluster.local cluster.local" >> /etc/resolv.conf

      - name: Checkout Application Code
        run: |
          git init
          git remote add origin "http://oauth2:${{ github.token }}@gitea-http.gitea.svc.cluster.local:3000/${{ github.repository }}.git"
          git fetch origin
          git checkout ${{ github.sha }}

      - name: Get Short SHA for Image Tag
        id: vars
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Download Deployment Tools
        run: |
          wget -q http://gitea-http.gitea.svc.cluster.local:3000/frengky/deployment-tools/raw/branch/main/scripts/build-and-deploy.sh
          chmod +x build-and-deploy.sh

      - name: Run CI/CD Pipeline
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          ./build-and-deploy.sh \
            "${{ inputs.app_name }}" \
            "${{ inputs.image_repo }}" \
            "${{ inputs.values_path }}"
