name: Auto Sync Grafana to ArgoCD

# Pipeline ini hanya akan berjalan jika ada perubahan pada folder grafana
on:
  push:
    branches:
      - main
    paths:
      - 'kubernetes/production/grafana/**'
      - 'kubernetes/applications/production/grafana.yaml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: http://vault.vault.svc.cluster.local:8200
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/data/ci/credentials argocd_token | ARGOCD_TOKEN

      - name: Download Sync Tool
        run: |
          wget -q https://gitea.frengky.xyz/frengky/deployment-tools/raw/branch/main/scripts/argocd-sync.sh
          chmod +x argocd-sync.sh

      - name: Trigger ArgoCD Sync
        run: |
          echo "Memulai sinkronisasi grafana-production..."
          ./argocd-sync.sh "http://argocd-server.argocd.svc.cluster.local:80" "${{ env.ARGOCD_TOKEN }}" "grafana-production"
