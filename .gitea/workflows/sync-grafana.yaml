name: Auto Sync Grafana to ArgoCD

# Pipeline ini hanya akan berjalan jika ada perubahan pada folder grafana
on:
  push:
    branches:
      - main
    paths:
      - 'kubernetes/production/grafana/**'
      - 'kubernetes/applications/production/grafana.yaml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Secrets from Vault
        run: |
          curl -s -H "X-Vault-Token: ${{ secrets.VAULT_TOKEN }}" http://vault.vault.svc.cluster.local:8200/v1/secret/data/ci/credentials > vault.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('vault.json')); fs.appendFileSync(process.env.GITHUB_ENV, 'ARGOCD_TOKEN=' + data.data.data.argocd_token + '\n');"

      - name: Download Sync Tool
        run: |
          wget -q http://gitea-http.gitea.svc.cluster.local:3000/frengky/deployment-tools/raw/branch/main/scripts/argocd-sync.sh
          chmod +x argocd-sync.sh

      - name: Trigger ArgoCD Sync
        run: |
          echo "Memulai sinkronisasi grafana-production..."
          ./argocd-sync.sh "http://argocd-server.argocd.svc.cluster.local:80" "${{ env.ARGOCD_TOKEN }}" "grafana-production"
