apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
spec:
  ingressClassName: traefik
  rules:
  - host: gitlab.frengky.xyz
    http:
      paths:
      - backend:
          service:
            name: gitlab-http
            port:
              number: 80
        path: /
        pathType: Prefix
