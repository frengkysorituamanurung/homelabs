persistence:
  enabled: true
  size: 30Gi
  storageClass: local-path

postgresql-ha:
  enabled: false

postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
  global:
    postgresql:
      auth:
        password: gitea
        database: gitea
        username: gitea
      service:
        ports:
          postgresql: 5432
  primary:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: local-path

valkey-cluster:
  enabled: true
  usePassword: false
  usePasswordFiles: false
  cluster:
    nodes: 3
    replicas: 0
  persistence:
    enabled: true
    storageClass: local-path
    size: 8Gi

gitea:
  admin:
    username: frengky
    password: "admin12345"
    email: "frengky@doku.com"
  config:
    actions:
      ENABLED: true
    server:
      DOMAIN: gitea.frengky.xyz
      ROOT_URL: https://gitea.frengky.xyz/
      SSH_DOMAIN: gitea.frengky.xyz
    database:
      DB_TYPE: postgres

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: gitea.frengky.xyz
      paths:
        - path: /
          pathType: Prefix
