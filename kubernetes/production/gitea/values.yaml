# Gitea configuration values
# Chart: gitea-charts/gitea v12.6.0
#
# CATATAN ARSITEKTUR:
# - Gitea: 1 replica (local-path hanya support RWO, tidak bisa RWX untuk multi-replica)
#   HA Gitea dicapai via: probes agresif (auto-restart) + PostgreSQL HA
# - PostgreSQL: 2 node HA via postgresql-ha (primary + standby dengan repmgr)

global:
  storageClass: "local-path"

# -- 1 replica (local-path adalah RWO, tidak support multi-replica Gitea)
# HA dijamin oleh: liveness probe agresif + PostgreSQL HA + fast restart
replicaCount: 1

# -- RollingUpdate dengan maxSurge=0 karena hanya 1 replica dan RWO PVC
strategy:
  type: "Recreate"

gitea:
  admin:
    username: "gitea_admin"
    password: "Gitea_Admin_Password_Secure123!"
    email: "admin@frengky.xyz"
    passwordMode: keepUpdated

  config:
    APP_NAME: "Gitea: Git with a cup of tea"
    RUN_MODE: prod
    server:
      DOMAIN: gitea.frengky.xyz
      ROOT_URL: https://gitea.frengky.xyz/
      SSH_DOMAIN: gitea.frengky.xyz
      SSH_PORT: 2222
      SSH_LISTEN_PORT: 22
      # -- Timeout longgar agar tidak triggering maintenance mode saat DB sedikit lambat
      READ_TIMEOUT: 60
      WRITE_TIMEOUT: 60
      IDLE_TIMEOUT: 120
    migrations:
      ALLOW_LOCALNETWORKS: true
    actions:
      ENABLED: true
    # -- DB Connection pool: cegah query timeout yang trigger maintenance mode
    database:
      MAX_OPEN_CONNS: 20
      MAX_IDLE_CONNS: 5
      CONN_MAX_LIFETIME: 3600
      LOG_SQL: false
    cache:
      ADAPTER: memory
      INTERVAL: 50
    session:
      PROVIDER: memory

  # -- Liveness probe via TCP: restart pod otomatis jika stuck/maintenance mode
  # failureThreshold=5 x periodSeconds=15 = max 75 detik maintenance mode sebelum restart
  livenessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 60
    timeoutSeconds: 5
    periodSeconds: 15
    successThreshold: 1
    failureThreshold: 5

  # -- Readiness probe via HTTP /api/healthz: keluarkan dari LB jika tidak sehat
  readinessProbe:
    enabled: true
    httpGet:
      path: /api/healthz
      port: http
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3

  # -- Startup probe: beri waktu extra saat cold start (max 3 menit)
  startupProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 18

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: NodePort
    port: 22
    nodePort: 32222

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: gitea.frengky.xyz
      paths:
        - path: /
          pathType: Prefix

persistence:
  enabled: true
  storageClass: "local-path"
  size: 5Gi
  accessModes:
    - ReadWriteOnce

# -- Disable single-node PostgreSQL
postgresql:
  enabled: false

# -- PostgreSQL HA: 2 node (primary + standby) via repmgr
# Jika primary crash, standby otomatis dipromote menjadi primary
postgresql-ha:
  enabled: true

  global:
    postgresql:
      database: gitea
      username: gitea
      password: "gitea-secure-db-password-123"

  postgresql:
    image:
      repository: bitnami/postgresql-repmgr
    repmgrPassword: "RepmgrSecure@456"
    postgresPassword: "PostgresRoot@123"
    password: "gitea-secure-db-password-123"

    # -- 2 instance: 1 primary + 1 standby
    replicaCount: 2

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

    persistence:
      enabled: true
      storageClass: "local-path"
      size: 5Gi

  pgpool:
    image:
      repository: bitnami/pgpool
    adminPassword: "PgpoolAdmin@789"

    # -- pgpool sebagai connection proxy: request selalu dikirim ke node aktif
    # Ini yang membuat Gitea tidak perlu tahu apakah primary atau standby yang aktif
    numInitChildren: 32
    maxPool: 4

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  metrics:
    image:
      repository: bitnami/postgres-exporter

valkey-cluster:
  enabled: false

valkey:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
