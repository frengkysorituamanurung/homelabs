              },
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 26
          },
          "id": 10,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "editorMode": "code",
              "expr": "sum(rate(node_disk_read_bytes_total[5m]))",
              "legendFormat": "Disk Read Bps",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "editorMode": "code",
              "expr": "sum(rate(node_disk_written_bytes_total[5m]))",
              "legendFormat": "Disk Write Bps",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Disk Throughput (Read / Write)",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [
        "cluster",
        "node",
        "overview",
        "victoriametrics"
      ],
      "time": {
        "from": "now-1h",
