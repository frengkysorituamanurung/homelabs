apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-telegram
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  telegram-notifiers.yaml: |
    apiVersion: 1
    contactPoints:
      - name: Telegram-Alerts
        receivers:
          - uid: telegram-receiver
            type: telegram
            disableResolveMessage: false
            settings:
              bottoken: "8950679283:AAFGTtMYZAln4U5ZJogwpVH68OriqrCmaX8"
              chatid: "6170551940"
              parse_mode: "HTML"
              send_resolved: true
              message: |
                {{ range .Alerts }}
                {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} <b>[{{ .Status | toUpper }}] {{ .Labels.alertname }}</b>

                <b>Severity:</b> {{ .Labels.severity }}
                <b>Cluster:</b> {{ if .Labels.cluster }}{{ .Labels.cluster }}{{ else }}homelabs{{ end }}
                <b>Namespace:</b> {{ if .Labels.namespace }}{{ .Labels.namespace }}{{ else }}N/A{{ end }}
                <b>Pod:</b> {{ if .Labels.pod }}{{ .Labels.pod }}{{ else }}N/A{{ end }}
                {{ if .Labels.reason }}<b>Reason:</b> {{ .Labels.reason }}{{ end }}
                {{ if .Labels.container }}<b>Container:</b> {{ .Labels.container }}{{ end }}

                <b>Summary:</b> {{ .Annotations.summary }}
                <b>Description:</b> {{ .Annotations.description }}
                -----------------------------------
                {{ end }}
    policies:
      - receiver: Telegram-Alerts
        group_by: ['alertname', 'namespace', 'pod', 'reason']
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-cluster-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  cluster-rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: Cluster-Pod-Health-Alerts
        folder: Cluster Production Alerts
        interval: 30s
        rules:
          - uid: rule-v3-pod-waiting
            title: "Pod ImagePullBackOff or Container Crash Waiting"
            condition: C
            for: 30s
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Pod Container Waiting: {{ $labels.reason }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has container {{ $labels.container }} stuck in {{ $labels.reason }} state."
            data:
              - refId: A
                datasourceUid: P4169E866C3094E38
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CrashLoopBackOff|CreateContainerConfigError|CreateContainerError"}) by (namespace, pod, container, reason)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                  refId: C

          - uid: rule-v3-pod-restarts
            title: "Pod Container High Restart Spike"
            condition: C
            for: 1m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Pod Container Restarts High"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} container {{ $labels.container }} restarted > 3 times in 15 minutes."
            data:
              - refId: A
                datasourceUid: P4169E866C3094E38
                relativeTimeRange:
                  from: 900
                  to: 0
                model:
                  editorMode: code
                  expr: "sum(increase(kube_pod_container_status_restarts_total[15m])) by (namespace, pod, container)"
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [3]
                        type: gt
                  refId: C

          - uid: rule-v3-container-oom
            title: "Pod Container Terminated via OOMKilled"
            condition: C
            for: 0s
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Container Terminated (OOMKilled)"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) terminated due to Out Of Memory."
            data:
              - refId: A
                datasourceUid: P4169E866C3094E38
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(kube_pod_container_status_terminated_reason{reason="OOMKilled"}) by (namespace, pod, container)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                  refId: C

          - uid: rule-v3-pod-unhealthy
            title: "Pod Container Unhealthy Phase"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "Pod in Unhealthy State"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is in Failed or Pending state for > 5 minutes."
            data:
              - refId: A
                datasourceUid: P4169E866C3094E38
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(kube_pod_status_phase{phase=~"Failed|Pending"}) by (namespace, pod)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                  refId: C

      - orgId: 1
        name: Cluster-Node-Resource-Alerts
        folder: Cluster Production Alerts
        interval: 1m
        rules:
          - uid: rule-v3-node-mem
            title: "Node RAM Memory Usage Exceeds 85%"
            condition: C
            for: 3m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "Node Memory Usage is > 85%"
              description: "Cluster node memory usage exceeds 85% for 3+ minutes."
            data:
              - refId: A
                datasourceUid: P4169E866C3094E38
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: "((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100"
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [85]
                        type: gt
                  refId: C

          - uid: rule-v3-node-cpu
            title: "Node CPU Usage Exceeds 85%"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "Node CPU Usage is > 85%"
              description: "Cluster node CPU usage exceeds 85% for 5+ minutes."
            data:
              - refId: A
                datasourceUid: P4169E866C3094E38
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: '100 - (avg(rate(node_cpu_seconds_total{job="prometheus.scrape.node_exporter", mode="idle"}[5m])) * 100)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [85]
                        type: gt
                  refId: C

          - uid: rule-v3-node-disk
            title: "Node Root Storage Free Below 15%"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Node Disk Free Space Low (<15%)"
              description: "Root filesystem free disk space is below 15%."
            data:
              - refId: A
                datasourceUid: P4169E866C3094E38
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: '((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [15]
                        type: lt
                  refId: C

      - orgId: 1
        name: Cluster-Services-Alerts
        folder: Cluster Production Alerts
        interval: 1m
        rules:
          - uid: rule-v3-tls-expiring
            title: "Domain SSL TLS Expiration Under 14 Days"
            condition: C
            for: 1m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "TLS Certificate Expiring Soon"
              description: "Domain TLS certificate expires in < 14 days."
            data:
              - refId: A
                datasourceUid: P4169E866C3094E38
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: "((traefik_tls_certs_not_after - time()) / 86400)"
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [14]
                        type: lt
                  refId: C

          - uid: rule-v3-database-mem
            title: "Database Redis High Memory Consumption"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "Database/Cache High RAM Usage"
              description: "Database or Redis container RAM usage > 800MB."
            data:
              - refId: A
                datasourceUid: P4169E866C3094E38
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(container_memory_working_set_bytes{pod=~".*(postgresql|database|redis).*", container=""}) by (namespace, pod)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [800000000]
                        type: gt
                  refId: C

          - uid: rule-v3-ingress-5xx
            title: "Traefik Ingress HTTP 5xx Server Errors Spike"
            condition: C
            for: 3m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Ingress HTTP 5xx Server Errors Spike"
              description: "More than 5% of HTTP requests returned 5xx errors."
            data:
              - refId: A
                datasourceUid: P4169E866C3094E38
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: '(sum(rate(traefik_entrypoint_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_entrypoint_requests_total[5m]))) * 100'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [5]
                        type: gt
                  refId: C

          - uid: rule-v3-loki-errors
            title: "Loki Log Error Ingestion Spike"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "High Error Log Rate"
              description: "Cluster recorded > 20 error log entries per minute."
            data:
              - refId: A
                datasourceUid: P8E80F9AEF21F6940
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(rate({namespace=~".*"} |~ "(?i)(error|exception|fatal)" [5m])) * 60'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [20]
                        type: gt
                  refId: C
