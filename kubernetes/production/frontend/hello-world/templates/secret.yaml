apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_ENV
      remoteRef:
        key: {{ printf "%s/%s/%s" (index .Values "generic-app" "environment" | default "production") .Release.Namespace .Release.Name }}
        property: APP_ENV
