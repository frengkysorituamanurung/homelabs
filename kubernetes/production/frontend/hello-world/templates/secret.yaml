apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello-world-secrets
  namespace: frontend
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: hello-world-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_ENV
      remoteRef:
        key: frontend/hello-world
        property: APP_ENV
