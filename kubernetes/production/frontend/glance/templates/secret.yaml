apiVersion: v1
kind: Secret
metadata:
  name: glance-config
  namespace: frontend
type: Opaque
stringData:
  glance.yml: |
    theme:
      background-color: 220 20 10
      primary-color: 220 90 60
      contrast-multiplier: 1.1
    card-width: 380px
    pages:
      - name: Home
        columns:
          - size: small
            widgets:
              - type: calendar
              - type: clock
                timezone: Asia/Jakarta
                format: h:mm:ss A
              - type: server-stats
                servers:
                  - type: local
                    name: Homelab Server

          - size: full
            widgets:
              - type: monitor
                title: Homelab Services
                sites:
                  - title: Gitea
                    url: https://gitea.frengky.xyz
                    icon: si:gitea
                  - title: Argo CD
                    url: https://argocd.frengky.xyz
                    icon: di:argo-cd
                  - title: Argo Rollouts
                    url: https://rollouts.frengky.xyz/rollouts
                    icon: di:argo-cd
                  - title: Harbor
                    url: https://harbor.frengky.xyz
                    icon: si:harbor
                  - title: Grafana
                    url: https://grafana.frengky.xyz
                    icon: si:grafana
                  - title: Vault
                    url: https://vault.frengky.xyz
                    icon: si:vault
              - type: rss
                limit: 10
                collapse-after: 5
                cache: 3h
                feeds:
                  - url: https://kubernetes.io/feed.xml
                    title: Kubernetes Blog
                  - url: https://www.cncf.io/feed/
                    title: CNCF
              - type: group
                widgets:
                  - type: reddit
                    subreddit: selfhosted
                    show-thumbnails: true
                    limit: 10
                    collapse-after: 5
                  - type: reddit
                    subreddit: homelab
                    show-thumbnails: true
                    limit: 10
                    collapse-after: 5
                  - type: reddit
                    subreddit: kubernetes
                    show-thumbnails: true
                    limit: 10
                    collapse-after: 5
                  - type: reddit
                    subreddit: docker
                    show-thumbnails: true
                    limit: 10
                    collapse-after: 5
                  - type: reddit
                    subreddit: devops
                    show-thumbnails: true
                    limit: 10
                    collapse-after: 5
                  - type: reddit
                    subreddit: sre
                    show-thumbnails: true
                    limit: 10
                    collapse-after: 5
                  - type: reddit
                    subreddit: bitcoin
                    show-thumbnails: true
                    limit: 10
                    collapse-after: 5

          - size: small
            widgets:
              - type: weather
                location: Jakarta, Indonesia
                units: metric
                hour-format: 12h
              - type: releases
                cache: 1d
                repositories:
                  - argoproj/argo-cd
                  - argoproj/argo-rollouts
                  - goharbor/harbor
                  - grafana/grafana
                  - glanceapp/glance

      - name: Markets
        columns:
          - size: small
            widgets:
              - type: stocks
                title: Indices
                stocks:
                  - symbol: SPY
                    name: S&P 500
                  - symbol: DX-Y.NYB
                    name: Dollar Index

              - type: stocks
                title: Crypto
                stocks:
                  - symbol: BTC-USD
                    name: Bitcoin
                  - symbol: ETH-USD
                    name: Ethereum

              - type: stocks
                title: Stocks
                stocks:
                  - symbol: TSLA
                    name: Tesla
                  - symbol: NVDA
                    name: NVIDIA
                  - symbol: GOOGL
                    name: Google
                  - symbol: AMZN
                    name: Amazon
                  - symbol: AMD
                    name: AMD
                  - symbol: RDDT
                    name: Reddit
                  - symbol: INTC
                    name: Intel

          - size: full
            widgets:
              - type: rss
                title: News
                style: horizontal-cards
                limit: 10
                cache: 1h
                feeds:
                  - url: https://www.foxbusiness.com/feed
                    title: Fox Business
                  - url: https://feeds.bloomberg.com/markets/news.rss
                    title: Bloomberg

              - type: group
                widgets:
                  - type: reddit
                    subreddit: technology
                    show-thumbnails: true
                    limit: 10
                    collapse-after: 5
                  - type: reddit
                    subreddit: wallstreetbets
                    show-thumbnails: true
                    limit: 10
                    collapse-after: 5

              - type: videos
                channels:
                  - UCbueTAeD_-Z-8s0FBTxdWFg
                limit: 8

          - size: small
            widgets:
              - type: rss
                title: News
                limit: 15
                collapse-after: 8
                cache: 1h
                feeds:
                  - url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
                    title: Wall Street Journal
                  - url: https://www.ft.com/rss/home
                    title: Financial Times