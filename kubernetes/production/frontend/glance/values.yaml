# Trigger pipeline sync 2
main-app:
  baseNamespace: frontend
  baseName: glance
  environment: production
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  image:
    repository: glanceapp/glance
    tag: "v0.8.5"
    pullPolicy: Always
  resources:
    requests:
      memory: 32Mi
      cpu: 6m
    limits:
      memory: 200Mi
      cpu: 100m
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 8080
  ingress:
    enabled: true
    stripPath: false
    hosts:
      - host: glance.frengky.xyz
        path: /
        port: 8080
  # deploymentStrategy:
  #   type: RollingUpdate
  healthCheck:
    enabled: true
    endpoint: /
    port: 8080
  mount:
    enabled: true
    mounts:
      - name: glance-config
        target: /app/config/glance.yml
