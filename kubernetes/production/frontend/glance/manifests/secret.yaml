apiVersion: v1
kind: Secret
metadata:
  name: glance-config
  namespace: frontend
type: Opaque
stringData:
  glance.yml: |
    # Glance configuration file
    # Reference: https://github.com/glanceapp/glance
    theme:
      background-color: 220 20 10
      primary-color: 220 90 60
      contrast-multiplier: 1.1
    card-width: 380px
    pages:
      - name: Home
        columns:
          - size: full
            widgets:
              - type: search
                autofocus: true
                placeholder: Search Google...
                search-engine: google
          - size: small
            widgets:
              - type: calendar
              - type: clock
                timezone: Asia/Jakarta
                format: h:mm:ss A
              - type: weather
                location: Jakarta, Indonesia
                units: metric
                hour-format: 12h
              - type: server-stats
                servers:
                  - type: local
                    name: Homelab Server
          - size: small
            widgets:
              - type: monitor
                title: Homelab Services
                sites:
                  - title: GitLab
                    url: https://gitlab.frengky.xyz
                    icon: si:gitlab
                  - title: Argo CD
                    url: https://argocd.frengky.xyz
                    icon: di:argo-cd
                  - title: Harbor
                    url: https://harbor.frengky.xyz
                    icon: si:harbor
                  - title: Grafana
                    url: https://grafana.frengky.xyz
                    icon: si:grafana
                  - title: Vault
                    url: https://vault.frengky.xyz
                    icon: si:vault
              - type: releases
                cache: 1d
                repositories:
                  - argoproj/argo-cd
                  - goharbor/harbor
                  - grafana/grafana
                  - glanceapp/glance
              - type: rss
                limit: 10
                collapse-after: 5
                cache: 3h
                feeds:
                  - url: https://kubernetes.io/feed.xml
                    title: Kubernetes Blog
                  - url: https://www.cncf.io/feed/
                    title: CNCF
          - size: small
            widgets:
              - type: reddit
                subreddit: selfhosted
                show-thumbnails: true
                limit: 10
                collapse-after: 5
                comments-url-template: https://www.reddit.com{POST_PATH}
              - type: reddit
                subreddit: homelab
                show-thumbnails: true
                limit: 10
                collapse-after: 5
                comments-url-template: https://www.reddit.com{POST_PATH}
              - type: reddit
                subreddit: kubernetes
                show-thumbnails: true
                limit: 10
                collapse-after: 5
                comments-url-template: https://www.reddit.com{POST_PATH}
              - type: reddit
                subreddit: docker
                show-thumbnails: true
                limit: 10
                collapse-after: 5
                comments-url-template: https://www.reddit.com{POST_PATH}
              - type: reddit
                subreddit: devops
                show-thumbnails: true
                limit: 10
                collapse-after: 5
                comments-url-template: https://www.reddit.com{POST_PATH}