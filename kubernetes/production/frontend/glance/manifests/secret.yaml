apiVersion: v1
kind: Secret
metadata:
  name: glance-config
  namespace: frontend
type: Opaque
stringData:
  glance.yml: |
    # Glance configuration file
    # Reference: https://github.com/glanceapp/glance
    
    theme:
      background-color: 220 20 10
      primary-color: 220 90 60
      contrast-multiplier: 1.1
    card-width: 380px
    
    pages:
      - name: Home
        columns:
          - size: full
            widgets:
              - type: search
                autofocus: true
                placeholder: Search Google...
                search-engine: google
          
          - size: small
            widgets:
              - type: calendar
              - type: clock
                timezone: Asia/Jakarta
                format: h:mm:ss A
              
          - size: small
            widgets:
              - type: monitor
                title: Homelab Services
                sites:
                  - title: GitLab
                    url: https://gitlab.frengky.xyz
                    icon: si-gitlab
                  - title: Argo CD
                    url: https://argocd.frengky.xyz
                    icon: si-argo-cd
                  - title: Harbor
                    url: https://harbor.frengky.xyz
                    icon: si-harbor
                  - title: Grafana
                    url: https://grafana.frengky.xyz
                    icon: si-grafana
