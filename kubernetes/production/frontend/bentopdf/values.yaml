generic-app:
  baseNamespace: frontend
  baseName: bentopdf
  environment: production
  disableSecrets: true
  image:
    repository: ghcr.io/alam00000/bentopdf-simple
    tag: "latest"
    pullPolicy: Always
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 100m
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 8080
  ingress:
    enabled: false  # Disabled — access via IngressRoute with Tailscale middleware below
  healthCheck:
    enabled: true
    endpoint: /
    port: 8080
  deploymentStrategy:
    type: Recreate
