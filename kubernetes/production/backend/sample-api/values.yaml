generic-app:
  baseNamespace: backend
  baseName: sample-api
  environment: production
  image:
    repository: harbor.frengky.xyz/backend/sample-api
    tag: "1d91294"
    pullPolicy: Always
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 8080
  ingress:
    enabled: true
    stripPath: false
    hosts:
      - host: api.frengky.xyz
        path: /
        port: 8080
  deploymentStrategy:
    type: BlueGreen
    blueGreen:
      autoPromotionEnabled: false
      autoPromotionSecons: 60
