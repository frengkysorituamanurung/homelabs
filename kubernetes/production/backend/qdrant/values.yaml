# values.yaml for Qdrant deployed via ArgoCD
replicaCount: 1

image:
  repository: harbor.frengky.xyz/library/qdrant
  tag: v1.18.2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      protocol: TCP
      checksEnabled: true
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
      checksEnabled: false

persistence:
  enabled: true
  accessModes: ["ReadWriteOnce"]
  size: 10Gi
  storageClassName: local-path

# Disable cluster mode (consensus) since we run a single-node setup
config:
  cluster:
    enabled: false
  service:
    enable_tls: false

# Authentication: disabled by default for easy local integration
# Enable by setting to a string token if security is required
apiKey: false
readOnlyApiKey: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi
