generic-app:
  baseNamespace: backend
  baseName: mcp-bridge
  environment: production
  image:
    repository: harbor.frengky.xyz/backend/mcp-bridge
    tag: "572ae80"
    pullPolicy: Always
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 8080
  ingress:
    enabled: true
    stripPath: false
    hosts:
      - host: mcp-bridge.frengky.xyz
        path: /
        port: 8080

