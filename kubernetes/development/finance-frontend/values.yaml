generic-app:
  baseNamespace: development
  baseName: finance-frontend
  environment: development
  refreshInterval: "10s"
  replicaCount: 1
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi
  image:
    repository: harbor.frengky.xyz/devops/finance-frontend
    tag: "v1.3.1"
    pullPolicy: Always
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 80
  ingress:
    enabled: true
    stripPath: false
    hosts:
      - host: finance-dev.frengky.xyz
        path: /
        port: 80
