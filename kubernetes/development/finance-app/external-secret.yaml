apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finance-backend-secret
  namespace: development
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: finance-backend-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/data/development/finance-app
        property: JWT_SECRET
    - secretKey: DB_HOST
      remoteRef:
        key: secret/data/development/finance-app
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: secret/data/development/finance-app
        property: DB_PORT
    - secretKey: DB_USER
      remoteRef:
        key: secret/data/development/finance-app
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/data/development/finance-app
        property: DB_PASSWORD
    - secretKey: DB_NAME
      remoteRef:
        key: secret/data/development/finance-app
        property: DB_NAME
    - secretKey: DB_SSLMODE
      remoteRef:
        key: secret/data/development/finance-app
        property: DB_SSLMODE
    - secretKey: ALLOW_ORIGINS
      remoteRef:
        key: secret/data/development/finance-app
        property: ALLOW_ORIGINS
