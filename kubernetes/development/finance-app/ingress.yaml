apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-ingress
  namespace: development
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: finance-dev.frengky.xyz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: finance-backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance-frontend-service
                port:
                  number: 80
