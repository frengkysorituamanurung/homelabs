apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-backend
  namespace: development
  labels:
    app: finance-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-backend
  template:
    metadata:
      labels:
        app: finance-backend
    spec:
      containers:
        - name: backend
          image: registry.frengky.xyz/devops/finance-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: JWT_SECRET
              value: "super-secret-jwt-key-change-this"
            - name: DB_HOST
              value: "sandbox-finance-rw.database.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sandbox-finance-credentials
                  key: username
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sandbox-finance-credentials
                  key: password
                  optional: true
            - name: DB_NAME
              value: "sandbox_finance"
            - name: DB_SSLMODE
              value: "disable"
            - name: ALLOW_ORIGINS
              value: "*"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
