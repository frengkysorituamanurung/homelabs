apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-frontend
  namespace: development
  labels:
    app: finance-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-frontend
  template:
    metadata:
      labels:
        app: finance-frontend
    spec:
      containers:
        - name: frontend
          image: registry.frengky.xyz/devops/finance-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
