apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-a-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: http://gitlab-http.gitlab.svc.cluster.local/devops/gitops.git
    targetRevision: main
    path: kubernetes/production/service-a
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
