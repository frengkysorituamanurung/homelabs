apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-production
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: harbor-registry-tls.harbor.svc.cluster.local
      chart: helm-repos/grafana
      targetRevision: "8.10.4"
      helm:
        valueFiles:
          - $values/kubernetes/production/grafana/values.yaml
    - repoURL: 'https://github.com/frengkysorituamanurung/homelabs.git'
      targetRevision: main
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
