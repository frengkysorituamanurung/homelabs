apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'http://gitea-http.gitea.svc.cluster.local:3000/frengky/gitops.git'
    path: kubernetes/production/grafana
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
