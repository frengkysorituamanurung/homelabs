apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: new-apps-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/devops/gitops.git
    targetRevision: main
    path: kubernetes/production/ingress
    directory:
      include: "new-apps-ingress.yaml"
  destination:
    server: https://kubernetes.default.svc
    # namespace intentionally omitted - manifest contains multiple namespaces
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
