{{- $values := index .Values "main-app" | default .Values -}}
{{- $isRollout := false -}}
{{- if $values.deploymentStrategy -}}
  {{- if eq $values.deploymentStrategy.type "BlueGreen" -}}
    {{- $isRollout = true -}}
  {{- end -}}
{{- end -}}
apiVersion: {{ if $isRollout }}argoproj.io/v1alpha1{{ else }}apps/v1{{ end }}
kind: {{ if $isRollout }}Rollout{{ else }}Deployment{{ end }}
metadata:
  name: {{ $values.baseName | default (include "generic-app.fullname" .) }}
  namespace: {{ $values.baseNamespace | default .Release.Namespace }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
    {{- if $values.environment }}
    environment: {{ $values.environment }}
    {{- end }}
spec:
  {{- if not (and $values.autoscaling $values.autoscaling.enabled) }}
  replicas: {{ $values.replicaCount | default 1 }}
  {{- end }}
  {{- if $isRollout }}
  strategy:
    blueGreen:
      autoPromotionEnabled: {{ $values.deploymentStrategy.blueGreen.autoPromotionEnabled }}
      activeService: {{ $values.baseName | default (include "generic-app.fullname" .) }}-active
      previewService: {{ $values.baseName | default (include "generic-app.fullname" .) }}-preview
  {{- else if $values.deploymentStrategy }}
  strategy:
    type: {{ $values.deploymentStrategy.type }}
    {{- if eq $values.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ $values.deploymentStrategy.rollingUpdate.maxSurge | default "25%" }}
      maxUnavailable: {{ $values.deploymentStrategy.rollingUpdate.maxUnavailable | default "25%" }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "generic-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "generic-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- if $values.hostNetwork }}
      hostNetwork: {{ $values.hostNetwork }}
      {{- end }}
      {{- if $values.dnsPolicy }}
      dnsPolicy: {{ $values.dnsPolicy }}
      {{- end }}
      containers:
        - name: {{ $values.baseName | default .Chart.Name }}
          image: "{{ $values.image.repository }}:{{ $values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $values.image.pullPolicy | default "Always" }}
          {{- if $values.service.ports }}
          ports:
            {{- range $values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
          {{- else if $values.service.port }}
          ports:
            - name: http
              containerPort: {{ $values.service.port }}
              protocol: TCP
          {{- end }}
          {{- if $values.resources }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          {{- end }}
          {{- if and $values.healthCheck $values.healthCheck.enabled }}
          livenessProbe:
            httpGet:
              path: {{ $values.healthCheck.endpoint | default "/" }}
              port: {{ $values.healthCheck.port | default 80 }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ $values.healthCheck.endpoint | default "/" }}
              port: {{ $values.healthCheck.port | default 80 }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          {{- if and $values.mount $values.mount.enabled }}
          volumeMounts:
            {{- range $values.mount.mounts }}
            - name: {{ .name | replace "." "-" }}
              mountPath: {{ .target }}
              subPath: {{ if eq (ext .target) "" }}{{ else }}{{ base .target }}{{ end }}
            {{- end }}
          {{- end }}
      {{- if and $values.mount $values.mount.enabled }}
      volumes:
        {{- range $values.mount.mounts }}
        - name: {{ .name | replace "." "-" }}
          secret:
            secretName: {{ .name }}
        {{- end }}
      {{- end }}
