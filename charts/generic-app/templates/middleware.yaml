{{- $values := index .Values "main-app" | default .Values -}}
{{- if and $values.ingress $values.ingress.enabled $values.ingress.stripPath }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $values.baseName | default (include "generic-app.fullname" .) }}-strip-prefix
  namespace: {{ $values.baseNamespace | default .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      {{- range $values.ingress.hosts }}
      - {{ .path }}
      {{- end }}
{{- end }}
