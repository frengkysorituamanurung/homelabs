{{- $values := index .Values "main-app" | default .Values -}}
{{- $isRollout := false -}}
{{- if $values.deploymentStrategy -}}
  {{- if eq $values.deploymentStrategy.type "BlueGreen" -}}
    {{- $isRollout = true -}}
  {{- end -}}
{{- end -}}
{{- if $isRollout }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $values.baseName | default (include "generic-app.fullname" .) }}-active
  namespace: {{ $values.baseNamespace | default .Release.Namespace }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
spec:
  type: {{ $values.service.type | default "ClusterIP" }}
  ports:
    {{- if $values.service.ports }}
    {{- range $values.service.ports }}
    - port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
      name: {{ .name }}
    {{- end }}
    {{- else }}
    - port: {{ $values.service.port | default 80 }}
      targetPort: http
      protocol: TCP
      name: http
    {{- end }}
  selector:
    {{- include "generic-app.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $values.baseName | default (include "generic-app.fullname" .) }}-preview
  namespace: {{ $values.baseNamespace | default .Release.Namespace }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
spec:
  type: {{ $values.service.type | default "ClusterIP" }}
  ports:
    {{- if $values.service.ports }}
    {{- range $values.service.ports }}
    - port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
      name: {{ .name }}
    {{- end }}
    {{- else }}
    - port: {{ $values.service.port | default 80 }}
      targetPort: http
      protocol: TCP
      name: http
    {{- end }}
  selector:
    {{- include "generic-app.selectorLabels" . | nindent 4 }}
{{- else }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $values.baseName | default (include "generic-app.fullname" .) }}
  namespace: {{ $values.baseNamespace | default .Release.Namespace }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
spec:
  type: {{ $values.service.type | default "ClusterIP" }}
  ports:
    {{- if $values.service.ports }}
    {{- range $values.service.ports }}
    - port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
      name: {{ .name }}
    {{- end }}
    {{- else }}
    - port: {{ $values.service.port | default 80 }}
      targetPort: http
      protocol: TCP
      name: http
    {{- end }}
  selector:
    {{- include "generic-app.selectorLabels" . | nindent 4 }}
{{- end }}
