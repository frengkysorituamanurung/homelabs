              "legendFormat": "{{cluster}} lag",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "CNPG Replication Lag",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
