 \"datasource\": { \"type\": \"prometheus\", \"uid\": \"VictoriaMetrics\" },\n      \"fieldConfig\": { \"defaults\": { \"color\": { \"mode\": \"palette-classic\" }, \"custom\": { \"drawStyle\": \"line\", \"fillOpacity\": 10, \"lineInterpolation\": \"smooth\" }, \"unit\": \"ops\" }, \"overrides\": [] },\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 4 },\n      \"id\": 3,\n      \"options\": { \"legend\": { \"displayMode\": \"table\", \"placement\": \"bottom\" }, \"tooltip\": { \"mode\": \"multi\" } },\n      \"targets\": [ { \"datasource\": { \"type\": \"prometheus\", \"uid\": \"VictoriaMetrics\" }, \"editorMode\": \"code\", \"expr\": \"sum(rate(cnpg_pg_stat_database_xact_commit[5m])) by (cluster, datname)\", \"legendFormat\": \"{{cluster}} / {{datname}} commits\", \"range\": true, \"refId\": \"A\" }, { \"datasource\": { \"type\": \"prometheus\", \"uid\": \"VictoriaMetrics\" }, \"editorMode\": \"code\", \"expr\": \"sum(rate(cnpg_pg_stat_database_xact_rollback[5m])) by (cluster, datname)\", \"legendFormat\": \"{{cluster}} / {{datname}} rollbacks\", \"range\": true, \"refId\": \"B\" } ],\n      \"title\": \"CNPG Transaction Rate\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"VictoriaMetrics\" },\n      \"fieldConfig\": { \"defaults\": { \"color\": { \"mode\": \"palette-classic\" }, \"custom\": { \"drawStyle\": \"line\", \"fillOpacity\": 10, \"lineInterpolation\": \"smooth\" }, \"unit\": \"s\" }, \"overrides\": [] },\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"y\": 12 },\n      \"id\": 4,\n      \"options\": { \"legend\": { \"displayMode\": \"table\", \"placement\": \"bottom\" }, \"tooltip\": { \"mode\": \"multi\" } },\n      \"targets\": [ { \"datasource\": { \"type\": \"prometheus\", \"uid\": \"VictoriaMetrics\" }, \"editorMode\": \"code\", \"expr\": \"max(cnpg_pg_replication_lag) by (cluster)\", \"legendFormat\": \"{{cluster}} lag\", \"range\": true, \"refId\": \"A\" } ],\n      \"title\": \"CNPG Replication Lag\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"VictoriaMetrics\" },\n      \"fieldConfig\": { \"defaults\": { \"color\": { \"mode\": \"palette-classic\" }, \"custom\": { \"drawStyle\": \"line\", \"fillOpacity\": 10, \"lineInterpolation\": \"smooth\" }, \"unit\": \"bytes\" }, \"overrides\": [] },\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 12 },\n      \"id\": 5,\n      \"options\": { \"legend\": { \"displayMode\": \"table\", \"placement\": \"bottom\" }, \"tooltip\": { \"mode\": \"multi\" } },\n      \"targets\": [ { \"datasource\": { \"type\": \"prometheus\", \"uid\": \"VictoriaMetrics\" }, \"editorMode\": \"code\", \"expr\": \"sum(container_memory_working_set_bytes{job=\\\"prometheus.scrape.cnpg\\\"}) by (pod)\", \"legendFormat\": \"{{pod}}\", \"range\": true, \"refId\": \"A\" } ],\n      \"title\": \"CNPG Pod Memory\",\n      \"type\": \"timeseries\"\n    }\n  ],\n  \"refresh\": \"30s\",\n  \"schemaVersion\": 38,\n  \"style\": \"dark\",\n  \"tags\": [ \"cnpg\", \"database\", \"postgresql\" ],\n  \"templating\": { \"list\": [ { \"current\": { \"selected\": false, \"text\": \"All\", \"value\": \"$__all\" }, \"datasource\": { \"type\": \"prometheus\", \"uid\": \"VictoriaMetrics\" }, \"definition\": \"label_values(cnpg_backends_total, cluster)\", \"hide\": 0, \"includeAll\": true, \"multi\": false, \"name\": \"cluster\", \"options\": [], \"query\": { \"query\": \"label_values(cnpg_backends_total, cluster)\", \"refId\": \"StandardVariableQuery\" }, \"refresh\": 1, \"regex\": \"\", \"sort\": 1, \"type\": \"query\" } ] },\n  \"time\": { \"from\": \"now-1h\", \"to\": \"now\" },\n  \"timepicker\": {},\n  \"timezone\": \"browser\",\n  \"title\": \"CloudNativePG Overview\",\n  \"uid\": \"cnpg-overview\",\n  \"version\": 1\n}"
