apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-telegram
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  telegram-notifiers.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: Telegram-Alerts
        receivers:
          - uid: telegram-receiver
            type: telegram
            disableResolveMessage: false
            settings:
              bottoken: "${TELEGRAM_BOT_TOKEN}"
              chatid: "6170551940"
              parse_mode: "None"
              send_resolved: true
              message: |
                [{{ .Status | toUpper }}] ({{ .Alerts | len }} alert(s))
                {{- range .Alerts }}
                - {{ .Labels.alertname }} ({{ .Labels.severity }}){{ if .Labels.namespace }} ns={{ .Labels.namespace }}{{ end }}{{ if .Labels.pod }} pod={{ .Labels.pod }}{{ end }}{{ if .Labels.job }} job={{ .Labels.job }}{{ end }}: {{ .Annotations.summary }}
                {{- end }}
    policies:
      - orgId: 1
        receiver: Telegram-Alerts
        group_by: ['alertname', 'namespace', 'pod', 'job', 'reason']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-cluster-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  cluster-rules.yaml: |
    apiVersion: 1
    deleteRules:
      - orgId: 1
        uid: v2-alert-node-mem
      - orgId: 1
        uid: v2-alert-node-cpu
      - orgId: 1
        uid: v2-alert-node-disk
      - orgId: 1
        uid: v2-alert-pod-waiting
      - orgId: 1
        uid: v2-alert-pod-restarts
      - orgId: 1
        uid: v2-alert-container-oomkilled
      - orgId: 1
        uid: v2-alert-pod-unhealthy
      - orgId: 1
        uid: v2-alert-tls-expiring
      - orgId: 1
        uid: v2-alert-database-mem
      - orgId: 1
        uid: v2-alert-ingress-5xx
      - orgId: 1
        uid: v2-alert-loki-errors
    groups:
      - orgId: 1
        name: Cluster-Pod-Health-Alerts
        folder: Cluster Production Alerts
        interval: 1m
        rules:
          - uid: rule-v3-pod-waiting
            title: "Pod ImagePullBackOff or Container Crash Waiting"
            condition: C
            for: 2m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Pod Container Waiting: {{ $labels.reason }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has container {{ $labels.container }} stuck in {{ $labels.reason }} state for > 2m."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-pod-waiting"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(kube_pod_container_status_waiting_reason{cluster="homelabs", reason=~"ImagePullBackOff|ErrImagePull|CrashLoopBackOff|CreateContainerConfigError|CreateContainerError"}) by (namespace, pod, container, reason)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                  refId: C

          - uid: rule-v3-pod-restarts
            title: "Pod Container High Restart Spike"
            condition: C
            for: 2m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "Pod Container Restarts High"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} container {{ $labels.container }} restarted > 3 times in 15 minutes."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-pod-restarts"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 900
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(increase(kube_pod_container_status_restarts_total{cluster="homelabs"}[15m])) by (namespace, pod, container)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [3]
                        type: gt
                  refId: C

          - uid: rule-v3-container-oom
            title: "Pod Container Terminated via OOMKilled"
            condition: C
            for: 1m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Container Terminated (OOMKilled)"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) terminated due to Out Of Memory."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-container-oom"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(kube_pod_container_status_last_terminated_reason{cluster="homelabs", reason="OOMKilled"} * on(namespace, pod, container) group_left() (increase(kube_pod_container_status_restarts_total{cluster="homelabs"}[15m]) > 0)) by (namespace, pod, container)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                  refId: C

          - uid: rule-v3-pod-unhealthy
            title: "Pod Container Unhealthy Phase"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "Pod in Unhealthy State"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is in Failed or Pending state for > 5 minutes."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-pod-unhealthy"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(kube_pod_status_phase{cluster="homelabs", phase=~"Failed|Pending"}) by (namespace, pod)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                  refId: C

          - uid: rule-v3-deployment-rollout
            title: "Deployment Replica Mismatch / Rollout Degraded"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
              description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has fewer available replicas than desired for > 5m."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-deployment-rollout"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: '(kube_deployment_spec_replicas{cluster="homelabs"} - kube_deployment_status_replicas_available{cluster="homelabs"}) > 0'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                  refId: C

      - orgId: 1
        name: Cluster-Node-Resource-Alerts
        folder: Cluster Production Alerts
        interval: 1m
        rules:
          - uid: rule-v3-node-not-ready
            title: "Kubernetes Node Not Ready"
            condition: C
            for: 2m
            no_data_state: Alerting
            exec_err_state: Alerting
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Kubernetes Node {{ $labels.node }} is NotReady"
              description: "Node readiness status is 0 for > 2 minutes."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-node-not-ready"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(kube_node_status_condition{cluster="homelabs", condition="Ready", status="true"}) by (node)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [1]
                        type: lt
                  refId: C

          - uid: rule-v3-node-mem
            title: "Node RAM Memory Usage Exceeds 90%"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "Node Memory Usage is > 90%"
              description: "Cluster node memory usage exceeds 90% for 5+ minutes."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-node-mem"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: '((node_memory_MemTotal_bytes{cluster="homelabs"} - node_memory_MemAvailable_bytes{cluster="homelabs"}) / node_memory_MemTotal_bytes{cluster="homelabs"}) * 100'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [90]
                        type: gt
                  refId: C

          - uid: rule-v3-node-cpu
            title: "Node CPU Usage Exceeds 85%"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "Node CPU Usage is > 85%"
              description: "Cluster node CPU usage exceeds 85% for 5+ minutes."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-node-cpu"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: '100 - (avg(rate(node_cpu_seconds_total{cluster="homelabs", job="prometheus.scrape.node_exporter", mode="idle"}[5m])) * 100)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [85]
                        type: gt
                  refId: C

          - uid: rule-v3-node-disk
            title: "Node Root Storage Free Below 15%"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Node Disk Free Space Low (<15%)"
              description: "Root filesystem free disk space is below 15%."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-node-disk"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: '((node_filesystem_avail_bytes{cluster="homelabs", mountpoint="/"} / node_filesystem_size_bytes{cluster="homelabs", mountpoint="/"}) * 100)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [15]
                        type: lt
                  refId: C

      - orgId: 1
        name: Cluster-Services-Alerts
        folder: Cluster Production Alerts
        interval: 1m
        rules:
          - uid: rule-v3-tls-expiring
            title: "Domain SSL TLS Expiration Under 14 Days"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "TLS Certificate Expiring Soon"
              description: "Active TLS certificate for {{ $labels.sans }} expires in < 14 days."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-tls-expiring"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: '(max by (sans) (traefik_tls_certs_not_after{cluster="homelabs", job="prometheus.scrape.traefik"}) - time()) / 86400'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [14]
                        type: lt
                  refId: C

          - uid: rule-v3-database-mem
            title: "Database Redis High Memory Consumption"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "Database/Cache High RAM Usage"
              description: "Database or Redis container RAM usage > 800MB."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-database-mem"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(container_memory_working_set_bytes{cluster="homelabs", pod=~".*(postgresql|database|redis).*"}) by (namespace, pod)'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [800000000]
                        type: gt
                  refId: C

          - uid: rule-v3-ingress-5xx
            title: "Traefik Ingress HTTP 5xx Server Errors Spike"
            condition: C
            for: 3m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Ingress HTTP 5xx Server Errors Spike"
              description: "More than 5% of HTTP requests returned 5xx errors over 5m."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-ingress-5xx"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: '(sum(rate(traefik_entrypoint_requests_total{cluster="homelabs", job="prometheus.scrape.traefik", code=~"5.."}[5m])) / (sum(rate(traefik_entrypoint_requests_total{cluster="homelabs", job="prometheus.scrape.traefik"}[5m])) > 0.1)) * 100'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [5]
                        type: gt
                  refId: C

          - uid: rule-v3-ingress-latency
            title: "Traefik Ingress High P95 Response Latency (>2s)"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "Elevated Ingress P95 Latency (>2s)"
              description: "Service {{ $labels.service }} P95 response latency is above 2 seconds for > 5m."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-ingress-latency"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket{cluster="homelabs", job="prometheus.scrape.traefik"}[5m])) by (le, service))'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [2]
                        type: gt
                  refId: C

          - uid: rule-v3-loki-errors
            title: "Loki Log Error Ingestion Spike"
            condition: C
            for: 5m
            no_data_state: OK
            exec_err_state: OK
            labels:
              severity: warning
              cluster: homelabs
            annotations:
              summary: "High Error Log Rate in Application Workloads"
              description: "Application namespaces recorded > 50 error log entries per minute for 5m."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#rule-v3-loki-errors"
            data:
              - refId: A
                datasourceUid: Loki
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'sum(rate({namespace=~"backend|production|staging|development|immich|harbor|vault|database"} |~ "(?i)(\"level\":\"error\"|level=error|exception|fatal|panic)" [5m])) * 60'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [50]
                        type: gt
                  refId: C

      - orgId: 1
        name: Observability-Platform-Alerts
        folder: Cluster Production Alerts
        interval: 1m
        rules:
          - uid: obs-alloy-down
            title: "Alloy Collector Down"
            condition: C
            for: 2m
            no_data_state: Alerting
            exec_err_state: Alerting
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "Grafana Alloy collector is down or not scraping"
              description: "Alloy collector self-scrape metric is below 1 for >2m. Metrics, logs, and traces collection may be impaired."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#obs-alloy-down"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'max(up{cluster="homelabs", namespace="monitoring", pod=~"alloy-.*"})'
                  refId: A
              - refId: B
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  refId: B
              - refId: C
                datasourceUid: "__expr__"
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [1]
                        type: lt
                  refId: C

          - uid: obs-victoriametrics-down
            title: "VictoriaMetrics Down"
            condition: C
            for: 2m
            no_data_state: Alerting
            exec_err_state: Alerting
            labels:
              severity: critical
              cluster: homelabs
            annotations:
              summary: "VictoriaMetrics is down"
              description: "VictoriaMetrics self-scrape metric is below 1 for >2m."
              runbook_url: "https://github.com/frengkysorituamanurung/homelabs/blob/main/docs/observability/alerting-and-runbooks.md#obs-victoriametrics-down"
            data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'max(up{cluster="homelabs", namespace="monitoring", pod=~"vmsingle-.*"})'
                  refId: A
              - refId: B
