              "queryType": "range",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "Loki"
              }
            }
          ],
          "title": "Real-Time Cluster Failure & Error Logs Stream",
          "type": "logs"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [
        "kubernetes",
        "events",
        "failures",
        "oomkilled"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "title": "Kubernetes Cluster Events & OOMKilled Tracker",
      "uid": "k8s-events-failures",
      "version": 1
