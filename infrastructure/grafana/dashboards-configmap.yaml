                "type": "tempo",
                "uid": "Tempo"
              },
              "queryType": "traceql",
              "query": "{resource.service.name=\"traefik-ingress\"}",
              "limit": 20,
              "tableType": "traces"
            }
          ],
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Correlated Logs Containing Trace IDs (Traefik & Finance-Backend)",
          "description": "",
          "datasource": {
            "type": "loki",
            "uid": "Loki"
          },
          "gridPos": {
            "x": 12,
            "y": 15,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "Loki"
              },
              "expr": "{cluster=\"homelabs\", namespace=~\"kube-system|development\"} |~ \"(TraceId|trace_id)\"",
              "editorMode": "code"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        }
      ]
    }

