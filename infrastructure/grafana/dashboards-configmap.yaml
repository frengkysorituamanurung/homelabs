              "placement": "bottom"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(increase(kube_pod_container_status_restarts_total[5m])) by (pod, namespace)",
              "legendFormat": "{{namespace}} / {{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              }
            }
          ],
          "title": "Pod Container Restart Spikes Timeline",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "id": 5,
          "options": {
