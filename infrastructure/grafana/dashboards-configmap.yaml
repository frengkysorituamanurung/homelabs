        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "id": 102,
          "title": "Live Pod Failure & Error Logs Stream",
          "type": "row"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "Loki"
          },
          "gridPos": {
            "h": 14,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 6,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showControls": true,
            "showLabels": true,
            "showLogLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
