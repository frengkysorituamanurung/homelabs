apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-workloads
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Core Observability"
data:
  k8s-workloads-health.json: |
    {
      "uid": "k8s-workloads-health",
      "title": "2. Kubernetes Cluster & Workloads",
      "tags": [
        "observability",
        "kubernetes",
        "sre"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "links": [
        {
          "title": "1. Home Server Overview",
          "url": "/d/homelab-home-dashboard",
          "type": "link",
          "icon": "apps",
          "keepTime": true
        },
        {
          "title": "2. Kubernetes Cluster",
          "url": "/d/k8s-workloads-health",
          "type": "link",
          "icon": "cloud",
          "keepTime": true
        },
        {
          "title": "3. Node & Infrastructure",
          "url": "/d/physical-server-monitoring",
          "type": "link",
          "icon": "monitor",
          "keepTime": true
        },
        {
          "title": "4. Application Monitoring",
          "url": "/d/app-http-golden-signals",
          "type": "link",
          "icon": "bolt",
          "keepTime": true
        },
        {
          "title": "5. Logs & Troubleshooting",
          "url": "/d/loki-logs-explorer",
          "type": "link",
          "icon": "file-alt",
          "keepTime": true
        },
        {
          "title": "6. Distributed Tracing",
          "url": "/d/distributed-tracing-tempo",
          "type": "link",
          "icon": "sitemap",
          "keepTime": true
        },
        {
          "title": "7. Observability Stack Health",
          "url": "/d/observability-stack-health",
          "type": "link",
          "icon": "heart",
          "keepTime": true
        },
        {
          "title": "Grafana Explore",
          "url": "/explore",
          "type": "link",
          "icon": "compass",
          "keepTime": true
        }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "VictoriaMetrics"
            },
            "query": {
              "query": "label_values(kube_pod_info{cluster=\"homelabs\"}, namespace)",
              "refId": "StandardVariableQuery"
            },
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "refresh": 1,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "workload",
            "label": "Pod / Workload Filter",
            "type": "textbox",
            "query": ".*",
            "current": {
              "selected": false,
              "text": ".*",
              "value": ".*"
            }
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Kubernetes Workload Status",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Ready Nodes",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(kube_node_status_condition{cluster=\"homelabs\", condition=\"Ready\", status=\"true\"})",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Running Pods",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 3,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(kube_pod_status_phase{cluster=\"homelabs\", namespace=~\"$namespace\", pod=~\"$workload\", phase=\"Running\"})",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pending / Unschedulable",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(kube_pod_status_phase{cluster=\"homelabs\", namespace=~\"$namespace\", pod=~\"$workload\", phase=\"Pending\"})",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Failed Pods",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 9,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(kube_pod_status_phase{cluster=\"homelabs\", namespace=~\"$namespace\", pod=~\"$workload\", phase=\"Failed\"})",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Deployments Available",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(kube_deployment_status_replicas_available{cluster=\"homelabs\", namespace=~\"$namespace\"}) / sum(kube_deployment_spec_replicas{cluster=\"homelabs\", namespace=~\"$namespace\"}) * 100",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 90
                  },
                  {
                    "color": "green",
                    "value": 100
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "StatefulSets Ready",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(kube_statefulset_status_replicas_ready{cluster=\"homelabs\", namespace=~\"$namespace\"}) / sum(kube_statefulset_replicas{cluster=\"homelabs\", namespace=~\"$namespace\"}) * 100",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 90
                  },
                  {
                    "color": "green",
                    "value": 100
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Container Restarts (24h)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{cluster=\"homelabs\", namespace=~\"$namespace\", pod=~\"$workload\"}[24h]))",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 3
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "row",
          "title": "Resource Consumption vs Requests & Limits (By Namespace / Top Pods)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Top 15 Pods Memory Usage (Working Set)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "topk(15, sum(container_memory_working_set_bytes{cluster=\"homelabs\", namespace=~\"$namespace\", pod=~\"$workload\", pod!=\"\"}) by (namespace, pod))",
              "legendFormat": "{{namespace}}/{{pod}}",
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Top 15 Pods CPU Usage (Cores)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "topk(15, sum(rate(container_cpu_usage_seconds_total{cluster=\"homelabs\", namespace=~\"$namespace\", pod=~\"$workload\", pod!=\"\"}[5m])) by (namespace, pod))",
              "legendFormat": "{{namespace}}/{{pod}}",
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Namespace Memory: Actual Usage vs Requests vs Limits",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(container_memory_working_set_bytes{cluster=\"homelabs\", namespace=~\"$namespace\", pod!=\"\"}) by (namespace)",
              "legendFormat": "Actual: {{namespace}}",
              "editorMode": "code"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(kube_pod_container_resource_requests{cluster=\"homelabs\", resource=\"memory\", namespace=~\"$namespace\"}) by (namespace)",
              "legendFormat": "Request: {{namespace}}",
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 5,
                "gradientMode": "opacity",
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Kubernetes API Server Request Rate & P99 Latency (Control Plane)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(rate(apiserver_request_total{cluster=\"homelabs\"}[5m])) by (verb)",
              "legendFormat": "{{verb}} req/s",
              "editorMode": "code"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{cluster=\"homelabs\", verb!=\"WATCH\"}[5m])) by (le))",
              "legendFormat": "P99 Latency (s)",
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 14,
          "type": "row",
          "title": "Restarts, OOMKills, Waiting Containers & Kubernetes Events",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Container Restart Rate & Waiting Containers",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 10,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{cluster=\"homelabs\", namespace=~\"$namespace\"}[15m])) by (namespace, pod) > 0",
              "legendFormat": "Restarts: {{namespace}}/{{pod}}",
              "editorMode": "code"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(kube_pod_container_status_waiting_reason{cluster=\"homelabs\", namespace=~\"$namespace\"}) by (namespace, pod, reason) > 0",
              "legendFormat": "Waiting ({{reason}}): {{namespace}}/{{pod}}",
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 16,
          "type": "logs",
          "title": "Live Kubernetes Cluster Events Stream (Loki source=\"k8s-events\")",
          "description": "",
          "datasource": {
            "type": "loki",
            "uid": "Loki"
          },
          "gridPos": {
            "x": 10,
            "y": 22,
            "w": 14,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "Loki"
              },
              "expr": "{cluster=\"homelabs\", source=\"k8s-events\", namespace=~\"$namespace\"}",
              "editorMode": "code"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
