              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              }
            },
            {
              "editorMode": "code",
              "expr": "sum(rate(traefik_entrypoint_requests_total{code=~\"4..\"}[1m]))",
              "legendFormat": "HTTP 4xx (Client Error)",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              }
            },
            {
              "editorMode": "code",
              "expr": "sum(rate(traefik_entrypoint_requests_total{code=~\"5..\"}[1m]))",
              "legendFormat": "HTTP 5xx (Server Error)",
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              }
            }
          ],
          "title": "HTTP Response Status Code Rates",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15
              },
              "unit": "ms"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "id": 6,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le)) * 1000",
              "legendFormat": "P50 Latency (ms)",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              }
            },
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.90, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le)) * 1000",
              "legendFormat": "P90 Latency (ms)",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              }
            },
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le)) * 1000",
              "legendFormat": "P99 Latency (ms)",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              }
            }
          ],
          "title": "Ingress Request Duration Latency (P50, P90, P99 ms)",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [
        "ingress",
        "traefik",
        "latency",
        "traffic"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "title": "Traefik Ingress Traffic & Domain Latency",
      "uid": "ingress-traffic-latency",
      "version": 1
    }

