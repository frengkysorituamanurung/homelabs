apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: umami
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: umami
      version: "2.4.3"
      sourceRef:
        kind: HelmRepository
        name: umami
        namespace: flux-system
  releaseName: umami
  targetNamespace: umami
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      hosts:
        - host: analytics.frengky.xyz
          paths:
            - path: /
              pathType: Prefix
      tls: []
    postgresql:
      enabled: true
      architecture: standalone
      auth:
        database: umami
        username: umami
      primary:
        persistence:
          enabled: true
          size: 8Gi
          storageClass: local-path
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi