# Gitea configuration values
# Chart: gitea-charts/gitea v12.6.0
#
# ARSITEKTUR HOMELAB (single-node k3s, local-path RWO):
# - Gitea: 1 replica dengan probes agresif untuk auto-restart cepat
# - PostgreSQL: 1 instance dengan resource cukup + liveness probe
# - Maintenance mode prevention: DB connection pool + timeout settings
# - Fast recovery: liveness probe restart Gitea jika maintenance mode >75s

global:
  storageClass: "local-path"

# -- 1 replica (local-path adalah RWO, tidak support multi-replica Gitea)
replicaCount: 1

# -- Recreate karena PVC adalah RWO
strategy:
  type: "Recreate"

gitea:
  admin:
    username: "gitea_admin"
    password: "Gitea_Admin_Password_Secure123!"
    email: "admin@frengky.xyz"
    passwordMode: keepUpdated

  config:
    APP_NAME: "Gitea: Git with a cup of tea"
    RUN_MODE: prod
    server:
      DOMAIN: gitea.frengky.xyz
      ROOT_URL: https://gitea.frengky.xyz/
      SSH_DOMAIN: gitea.frengky.xyz
      SSH_PORT: 2222
      SSH_LISTEN_PORT: 22
      # -- Timeout longgar: cegah maintenance mode akibat DB sedikit lambat
      READ_TIMEOUT: 60
      WRITE_TIMEOUT: 60
      IDLE_TIMEOUT: 120
    migrations:
      ALLOW_LOCALNETWORKS: true
    actions:
      ENABLED: true
    # -- DB Connection pool: cegah query timeout yang trigger maintenance mode
    # MAX_OPEN_CONNS: maksimum koneksi ke DB (default: 0 = unlimited, rawan exhaust)
    # MAX_IDLE_CONNS: koneksi idle yang dipertahankan di pool
    # CONN_MAX_LIFETIME: max umur koneksi dalam detik (recycle agar tidak stale)
    database:
      MAX_OPEN_CONNS: 20
      MAX_IDLE_CONNS: 5
      CONN_MAX_LIFETIME: 3600
      LOG_SQL: false
    cache:
      ADAPTER: memory
      INTERVAL: 50
    session:
      PROVIDER: memory

  # -- Liveness probe via TCP: auto-restart jika Gitea stuck (termasuk maintenance mode)
  # failureThreshold=5 x periodSeconds=15 = restart setelah max 75 detik maintenance mode
  livenessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 60
    timeoutSeconds: 5
    periodSeconds: 15
    successThreshold: 1
    failureThreshold: 5

  # -- Readiness probe via HTTP API: keluarkan dari LB jika tidak siap melayani traffic
  readinessProbe:
    enabled: true
    httpGet:
      path: /api/healthz
      port: http
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3

  # -- Startup probe: beri waktu extra saat cold start (max ~3 menit)
  startupProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 18

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: NodePort
    port: 22
    nodePort: 32222

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: gitea.frengky.xyz
      paths:
        - path: /
          pathType: Prefix

persistence:
  enabled: true
  storageClass: "local-path"
  size: 5Gi

# -- PostgreSQL single instance (bitnami/postgresql sudah ada di cluster)
postgresql-ha:
  enabled: false

postgresql:
  enabled: true
  global:
    postgresql:
      auth:
        database: gitea
        username: gitea
        password: gitea-secure-db-password-123
  primary:
    persistence:
      enabled: true
      storageClass: "local-path"
      size: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    # -- Liveness probe PostgreSQL: restart jika DB tidak mau terima koneksi
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    # -- Startup probe: beri waktu 5 menit untuk cold start PostgreSQL
    startupProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    # -- PostgreSQL parameters untuk performa dan stabilitas
    extraEnvVars:
      - name: POSTGRESQL_MAX_CONNECTIONS
        value: "100"

valkey-cluster:
  enabled: false

valkey:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
