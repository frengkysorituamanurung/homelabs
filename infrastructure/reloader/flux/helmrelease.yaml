apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: reloader
      version: "2.2.18"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  releaseName: reloader
  targetNamespace: reloader
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      deployment:
        image:
          name: ghcr.io/stakater/reloader
          tag: v1.4.22
      autoReloadAll: true
