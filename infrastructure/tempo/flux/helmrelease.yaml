apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: tempo
      version: "1.24.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  releaseName: tempo
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicas: 1
    tempo:
      repository: grafana/tempo
      tag: "2.9.0"
      pullPolicy: IfNotPresent
      memBallastSizeMbs: 64
      multitenancyEnabled: false
      reportingEnabled: false
      retention: 168h
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      metricsGenerator:
        enabled: true
        remoteWriteUrl: "http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write"
        processor:
          service_graphs:
            wait: 10s
            max_items: 5000
          span_metrics:
            enable_target_info: true
          local_blocks:
            flush_to_storage: true
            filter_server_spans: false
        storage:
          path: "/var/tempo/metrics"
        traces_storage:
          path: "/var/tempo/wal"
      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics
              - local-blocks
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
    persistence:
      enabled: true
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 5Gi
    service:
      type: ClusterIP
