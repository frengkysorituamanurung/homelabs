apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: alloy
      version: "1.14.3"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  releaseName: alloy
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    alloy:
      image:
        repository: docker.io/grafana/alloy
        tag: v1.21.2
      configMap:
        content: |-
           discovery.kubernetes "pods" {
             role = "pod"
           }

           discovery.relabel "pods" {
             targets = discovery.kubernetes.pods.targets
             rule {
               source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
               regex         = "prometheus-node-exporter"
               action        = "drop"
             }
           }

           prometheus.scrape "kubernetes_pods" {
             targets    = discovery.relabel.pods.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           prometheus.remote_write "vm" {
             endpoint {
               url = "http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write"
             }
           }

           discovery.kubernetes "pods_logs" {
             role = "pod"
           }

           discovery.relabel "pods_logs" {
             targets = discovery.kubernetes.pods_logs.targets
             rule {
               source_labels = ["__meta_kubernetes_namespace"]
               target_label  = "namespace"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_name"]
               target_label  = "pod"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_container_name"]
               target_label  = "container"
             }
           }

           discovery.kubernetes "kube_state_metrics" {
             role = "service"
           }

           discovery.relabel "kube_state_metrics" {
             targets = discovery.kubernetes.kube_state_metrics.targets

             rule {
               source_labels = ["__meta_kubernetes_service_name"]
               regex = "kube-state-metrics"
               action = "keep"
             }
           }

           prometheus.scrape "kube_state_metrics" {
             targets    = discovery.relabel.kube_state_metrics.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           discovery.kubernetes "nodes" {
             role = "node"
           }

           prometheus.scrape "kubelet" {
             targets           = discovery.kubernetes.nodes.targets
             scheme            = "https"
             bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

             tls_config {
               insecure_skip_verify = true
             }

             forward_to = [prometheus.remote_write.vm.receiver]
           }

           prometheus.scrape "cadvisor" {
             targets           = discovery.kubernetes.nodes.targets
             metrics_path      = "/metrics/cadvisor"
             scheme            = "https"
             bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

             tls_config {
               insecure_skip_verify = true
             }

             forward_to = [prometheus.remote_write.vm.receiver]
           }

           discovery.kubernetes "node_exporter" {
             role = "service"
           }

           discovery.relabel "node_exporter" {
             targets = discovery.kubernetes.node_exporter.targets

             rule {
               source_labels = ["__meta_kubernetes_service_name"]
               regex         = ".*node-exporter.*"
               action        = "keep"
             }
           }

           prometheus.scrape "node_exporter" {
             targets    = discovery.relabel.node_exporter.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           discovery.kubernetes "traefik" {
             role = "service"
           }

           discovery.relabel "traefik" {
             targets = discovery.kubernetes.traefik.targets

             rule {
               source_labels = ["__meta_kubernetes_service_name"]
               regex         = "traefik"
               action        = "keep"
             }

             rule {
               source_labels = ["__address__"]
               regex         = "(.*):.*"
               target_label  = "__address__"
               replacement   = "${1}:9100"
             }
           }

           prometheus.scrape "traefik" {
             targets      = discovery.relabel.traefik.output
             metrics_path = "/metrics"
             forward_to   = [prometheus.remote_write.vm.receiver]
           }

           discovery.kubernetes "garage" {
             role = "service"
           }

           discovery.relabel "garage" {
             targets = discovery.kubernetes.garage.targets

             rule {
               source_labels = ["__meta_kubernetes_service_name"]
               regex         = "garage-metrics"
               action        = "keep"
             }
           }

           prometheus.scrape "garage" {
             targets    = discovery.relabel.garage.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           discovery.kubernetes "flux" {
             role = "pod"
             namespaces {
               names = ["flux-system"]
             }
           }

           discovery.relabel "flux" {
             targets = discovery.kubernetes.flux.targets

             rule {
               source_labels = ["__meta_kubernetes_namespace"]
               regex         = "flux-system"
               action        = "keep"
             }

             rule {
               source_labels = ["__address__"]
               regex         = "(.*):.*"
               target_label  = "__address__"
               replacement   = "${1}:8080"
             }
           }

           prometheus.scrape "flux" {
             targets      = discovery.relabel.flux.output
             metrics_path = "/metrics"
             forward_to   = [prometheus.remote_write.vm.receiver]
           }

           discovery.relabel "annotated_pods" {
             targets = discovery.kubernetes.pods.targets

             rule {
               source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
               regex         = "true"
               action        = "keep"
             }

             rule {
               source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
               separator     = ":"
               target_label  = "__address__"
               replacement   = "$1:$2"
             }

             rule {
               source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
               target_label  = "__metrics_path__"
               replacement   = "$1"
             }
           }

           prometheus.scrape "annotated_pods" {
             targets    = discovery.relabel.annotated_pods.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           discovery.kubernetes "blackbox" {
             role = "service"
           }

           discovery.relabel "blackbox" {
             targets = discovery.kubernetes.blackbox.targets

             rule {
               source_labels = ["__meta_kubernetes_service_name"]
               regex         = "blackbox-exporter"
               action        = "keep"
             }

             rule {
               source_labels = ["__address__"]
               regex         = "(.*):.*"
               target_label  = "__address__"
               replacement   = "${1}:9115"
             }
           }

           discovery.kubernetes "cnpg" {
             role = "pod"
           }

           discovery.relabel "cnpg" {
             targets = discovery.kubernetes.cnpg.targets
             rule {
               source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
               regex         = ".+"
               action        = "keep"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_ip"]
               target_label  = "__address__"
               replacement   = "$1:9187"
             }
           }

           prometheus.scrape "cnpg" {
             targets    = discovery.relabel.cnpg.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           prometheus.scrape "blackbox_self" {
             targets    = discovery.relabel.blackbox.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           prometheus.scrape "blackbox_probe" {
             targets = [
               {"__address__" = "blackbox-exporter.monitoring.svc.cluster.local:9115", "__param_target" = "https://grafana.frengky.xyz", "__param_module" = "http_2xx"},
               {"__address__" = "blackbox-exporter.monitoring.svc.cluster.local:9115", "__param_target" = "https://vault.frengky.xyz", "__param_module" = "http_2xx"},
               {"__address__" = "blackbox-exporter.monitoring.svc.cluster.local:9115", "__param_target" = "https://harbor.frengky.xyz", "__param_module" = "http_2xx"},
               {"__address__" = "blackbox-exporter.monitoring.svc.cluster.local:9115", "__param_target" = "https://gitea.frengky.xyz", "__param_module" = "http_2xx"},
               {"__address__" = "blackbox-exporter.monitoring.svc.cluster.local:9115", "__param_target" = "https://glance.frengky.xyz", "__param_module" = "http_2xx"},
               {"__address__" = "blackbox-exporter.monitoring.svc.cluster.local:9115", "__param_target" = "https://hello.frengky.xyz", "__param_module" = "http_2xx"},
               {"__address__" = "blackbox-exporter.monitoring.svc.cluster.local:9115", "__param_target" = "https://service-a.frengky.xyz", "__param_module" = "http_2xx"},
             ]
             forward_to  = [prometheus.remote_write.vm.receiver]
             metrics_path = "/probe"
           }

           loki.source.kubernetes "pods_logs" {
             targets    = discovery.relabel.pods_logs.output
             forward_to = [loki.write.default.receiver]
           }

           loki.write "default" {
             endpoint {
               url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
             }
           }

      mounts:
        varlog: true
        dockercontainers: true

      extraEnv:
        - name: GOMEMLIMIT
          value: "384MiB"

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

    controller:
      type: daemonset
