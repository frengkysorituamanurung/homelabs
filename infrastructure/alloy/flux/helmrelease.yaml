apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: alloy
      version: "1.14.3"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  releaseName: alloy
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    alloy:
      image:
        repository: docker.io/grafana/alloy
        tag: v1.21.2
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
      configMap:
        content: |-
           // =========================================================================
           // 1. PROMETHEUS REMOTE WRITE DESTINATION (VictoriaMetrics)
           // =========================================================================
           prometheus.remote_write "vm" {
             endpoint {
               url = "http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write"
             }
             external_labels = {
               cluster = "homelabs",
             }
           }

           // =========================================================================
           // 2. INFRASTRUCTURE & KUBERNETES CORE METRICS
           // =========================================================================
           discovery.kubernetes "nodes" {
             role = "node"
           }

           prometheus.scrape "kubelet" {
             targets           = discovery.kubernetes.nodes.targets
             scheme            = "https"
             bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
             tls_config {
               insecure_skip_verify = true
             }
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           prometheus.scrape "cadvisor" {
             targets           = discovery.kubernetes.nodes.targets
             metrics_path      = "/metrics/cadvisor"
             scheme            = "https"
             bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
             tls_config {
               insecure_skip_verify = true
             }
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           prometheus.scrape "apiserver" {
             targets = [{
               "__address__" = "kubernetes.default.svc.cluster.local:443",
             }]
             scheme            = "https"
             bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
             tls_config {
               insecure_skip_verify = true
             }
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           discovery.kubernetes "services" {
             role = "service"
           }

           discovery.relabel "kube_state_metrics" {
             targets = discovery.kubernetes.services.targets
             rule {
               source_labels = ["__meta_kubernetes_service_name"]
               regex         = "kube-state-metrics"
               action        = "keep"
             }
           }

           prometheus.scrape "kube_state_metrics" {
             targets    = discovery.relabel.kube_state_metrics.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           discovery.relabel "node_exporter" {
             targets = discovery.kubernetes.services.targets
             rule {
               source_labels = ["__meta_kubernetes_service_name"]
               regex         = ".*node-exporter.*"
               action        = "keep"
             }
           }

           prometheus.scrape "node_exporter" {
             targets    = discovery.relabel.node_exporter.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           // =========================================================================
           // 3. PLATFORM & OBSERVABILITY COMPONENT METRICS
           // =========================================================================
           discovery.kubernetes "pods" {
             role = "pod"
           }

           // Scrape only container ports explicitly named for metrics or annotated
           discovery.relabel "kubernetes_pods" {
             targets = discovery.kubernetes.pods.targets
             rule {
               source_labels = ["__meta_kubernetes_pod_phase"]
               regex         = "Pending|Succeeded|Failed|Completed"
               action        = "drop"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
               regex         = "prometheus-node-exporter|kube-state-metrics"
               action        = "drop"
             }
             rule {
               source_labels = ["__meta_kubernetes_namespace"]
               regex         = "flux-system"
               action        = "drop"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_container_port_name", "__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
               regex         = "(http-metrics|metrics|prom-metrics);.*|http;(vmsingle|loki|tempo|finance-backend-dev)|grafana;grafana-production"
               action        = "keep"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
               regex         = "traefik"
               action        = "drop"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
               regex         = ".+"
               action        = "drop"
             }
             rule {
               source_labels = ["__meta_kubernetes_namespace"]
               target_label  = "namespace"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_name"]
               target_label  = "pod"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_container_name"]
               target_label  = "container"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
               target_label  = "app"
             }
           }

           prometheus.scrape "kubernetes_pods" {
             targets    = discovery.relabel.kubernetes_pods.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           // Annotated pods ( removed duplicate block since kubernetes_pods, flux, and traefik handle all ports )

           // Traefik metrics (via pod port 9100)
           discovery.relabel "traefik" {
             targets = discovery.kubernetes.pods.targets
             rule {
               source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_container_port_name"]
               regex         = "kube-system;traefik;metrics"
               action        = "keep"
             }
             rule {
               source_labels = ["__meta_kubernetes_namespace"]
               target_label  = "namespace"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_name"]
               target_label  = "pod"
             }
           }

           prometheus.scrape "traefik" {
             targets      = discovery.relabel.traefik.output
             metrics_path = "/metrics"
             forward_to   = [prometheus.remote_write.vm.receiver]
           }

           // Garage object storage metrics
           discovery.relabel "garage" {
             targets = discovery.kubernetes.services.targets
             rule {
               source_labels = ["__meta_kubernetes_service_name"]
               regex         = "garage-metrics"
               action        = "keep"
             }
           }

           prometheus.scrape "garage" {
             targets    = discovery.relabel.garage.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           // Flux CD controllers metrics (deduplicated per pod on port 8080)
           discovery.kubernetes "flux" {
             role = "pod"
             namespaces {
               names = ["flux-system"]
             }
           }

           discovery.relabel "flux" {
             targets = discovery.kubernetes.flux.targets
             rule {
               source_labels = ["__meta_kubernetes_pod_container_port_name"]
               regex         = "http-prom"
               action        = "keep"
             }
             rule {
               source_labels = ["__meta_kubernetes_namespace"]
               target_label  = "namespace"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_name"]
               target_label  = "pod"
             }
           }

           prometheus.scrape "flux" {
             targets      = discovery.relabel.flux.output
             metrics_path = "/metrics"
             forward_to   = [prometheus.remote_write.vm.receiver]
           }

           // CloudNativePG PostgreSQL clusters
           discovery.relabel "cnpg" {
             targets = discovery.kubernetes.pods.targets
             rule {
               source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster", "__meta_kubernetes_pod_container_port_name"]
               regex         = ".+;metrics"
               action        = "keep"
             }
             rule {
               source_labels = ["__meta_kubernetes_namespace"]
               target_label  = "namespace"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_name"]
               target_label  = "pod"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
               target_label  = "cluster"
             }
           }

           prometheus.scrape "cnpg" {
             targets    = discovery.relabel.cnpg.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           // =========================================================================
           // 4. BLACKBOX SYNTHETIC PROBING (Internal & External Endpoints)
           // =========================================================================
           discovery.relabel "blackbox" {
             targets = discovery.kubernetes.services.targets
             rule {
               source_labels = ["__meta_kubernetes_service_name"]
               regex         = "blackbox-exporter-prometheus-blackbox-exporter"
               action        = "keep"
             }
           }

           prometheus.scrape "blackbox_self" {
             targets    = discovery.relabel.blackbox.output
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           prometheus.exporter.blackbox "endpoints" {
             config_file = ""
             config      = "{ modules: { http_2xx: { prober: http, timeout: 5s, http: { valid_http_versions: [HTTP/1.1, HTTP/2.0], valid_status_codes: [200, 201, 204, 301, 302, 303, 307, 308], follow_redirects: true, tls_config: { insecure_skip_verify: true } } } } }"
             target {
               name    = "grafana"
               address = "http://grafana-production.monitoring.svc.cluster.local:80/api/health"
               module  = "http_2xx"
             }
             target {
               name    = "vault"
               address = "http://vault.vault.svc.cluster.local:8200/v1/sys/health"
               module  = "http_2xx"
             }
             target {
               name    = "harbor"
               address = "http://harbor-core.harbor.svc.cluster.local:80/api/v2.0/health"
               module  = "http_2xx"
             }
             target {
               name    = "glance"
               address = "http://glance.frontend.svc.cluster.local:8080/"
               module  = "http_2xx"
             }
             target {
               name    = "hello-world"
               address = "http://hello-world.frontend.svc.cluster.local:80/"
               module  = "http_2xx"
             }
             target {
               name    = "service-a"
               address = "http://service-a-generic-app.production.svc.cluster.local:80/"
               module  = "http_2xx"
             }
             target {
               name    = "test-gitops"
               address = "http://test-gitops.backend.svc.cluster.local:8080/health"
               module  = "http_2xx"
             }
             target {
               name    = "sample-api"
               address = "http://sample-api.backend.svc.cluster.local:8080/"
               module  = "http_2xx"
             }
             target {
               name    = "finance-backend"
               address = "http://finance-backend.development.svc.cluster.local:8080/api/health"
               module  = "http_2xx"
             }
             target {
               name    = "uptime-kuma"
               address = "http://uptime-kuma.uptime-kuma.svc.cluster.local:3001/"
               module  = "http_2xx"
             }
             target {
               name    = "umami"
               address = "http://umami-umami.umami.svc.cluster.local:80/api/heartbeat"
               module  = "http_2xx"
             }
           }

           prometheus.scrape "blackbox_probe" {
             targets    = prometheus.exporter.blackbox.endpoints.targets
             forward_to = [prometheus.remote_write.vm.receiver]
           }

           // =========================================================================
           // 5. CENTRALIZED LOGS PIPELINE (Filesystem Discovery + Enrichment + Loki)
           // =========================================================================
           discovery.relabel "pods_logs" {
             targets = discovery.kubernetes.pods.targets
             rule {
               source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
               target_label  = "__path__"
               separator     = "/"
               replacement   = "/var/log/pods/*$1/*.log"
             }
             rule {
               source_labels = ["__meta_kubernetes_namespace"]
               target_label  = "namespace"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_name"]
               target_label  = "pod"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_container_name"]
               target_label  = "container"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
               target_label  = "app"
             }
             rule {
               source_labels = ["__meta_kubernetes_pod_node_name"]
               target_label  = "node"
             }
           }

           local.file_match "pods_logs" {
             path_targets = discovery.relabel.pods_logs.output
           }

           loki.source.file "pods_logs" {
             targets               = local.file_match.pods_logs.targets
             tail_from_end         = true
             legacy_positions_file = ""
             forward_to            = [loki.process.pods_logs.receiver]
           }

           loki.process "pods_logs" {
             stage.cri {}

             stage.drop {
               older_than          = "168h"
               drop_counter_reason = "too_old_for_loki"
             }

             stage.label_drop {
               values = ["filename"]
             }

             stage.static_labels {
               values = {
                 cluster = "homelabs",
               }
             }

             // Extract JSON fields if the log line is structured JSON (e.g. finance-backend or traefik accesslog)
             stage.json {
               expressions = {
                 trace_id       = "trace_id",
                 TraceId        = "TraceId",
                 span_id        = "span_id",
                 SpanId         = "SpanId",
                 method         = "method",
                 RequestMethod  = "RequestMethod",
                 path           = "path",
                 RequestPath    = "RequestPath",
                 status         = "status",
                 OriginStatus   = "OriginStatus",
                 RequestHost    = "RequestHost",
                 level_json     = "level",
               }
               drop_malformed = false
             }

             stage.template {
               source   = "trace_id"
               template = "{{`{{ if .trace_id }}{{ .trace_id }}{{ else if .TraceId }}{{ .TraceId }}{{ end }}`}}"
             }

             stage.template {
               source   = "span_id"
               template = "{{`{{ if .span_id }}{{ .span_id }}{{ else if .SpanId }}{{ .SpanId }}{{ end }}`}}"
             }

             stage.template {
               source   = "method"
               template = "{{`{{ if .method }}{{ .method }}{{ else if .RequestMethod }}{{ .RequestMethod }}{{ end }}`}}"
             }

             stage.template {
               source   = "path"
               template = "{{`{{ if .path }}{{ .path }}{{ else if .RequestPath }}{{ .RequestPath }}{{ end }}`}}"
             }

             stage.template {
               source   = "status"
               template = "{{`{{ if .status }}{{ .status }}{{ else if .OriginStatus }}{{ .OriginStatus }}{{ end }}`}}"
             }

             // Extract log level from logfmt or standard text logs
             stage.regex {
               expression = "(?i)(?:level|lvl|severity)=[\"]?(?P<level_kv>debug|info|warn|warning|error|fatal|critical|panic)[\"]?"
             }

             stage.template {
               source   = "level"
               template = "{{`{{ if .level_json }}{{ ToLower .level_json }}{{ else if .level_kv }}{{ ToLower .level_kv }}{{ else }}info{{ end }}`}}"
             }

             stage.labels {
               values = {
                 level = "level",
               }
             }

             stage.structured_metadata {
               values = {
                 trace_id = "trace_id",
                 span_id  = "span_id",
                 method   = "method",
                 path     = "path",
                 status   = "status",
                 host     = "RequestHost",
               }
             }

             forward_to = [loki.write.default.receiver]
           }

           // =========================================================================
           // 6. KUBERNETES CLUSTER EVENTS PIPELINE -> LOKI
           // =========================================================================
           loki.source.kubernetes_events "cluster_events" {
             job_name   = "integrations/kubernetes/eventhandler"
             log_format = "logfmt"
             forward_to = [loki.process.cluster_events.receiver]
           }

           loki.process "cluster_events" {
             stage.static_labels {
               values = {
                 cluster = "homelabs",
                 source  = "k8s-events",
               }
             }
             forward_to = [loki.write.default.receiver]
           }

           loki.write "default" {
             endpoint {
               url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
             }
           }

           // =========================================================================
           // 7. OPENTELEMETRY TRACING PIPELINE -> GRAFANA TEMPO
           // =========================================================================
           otelcol.receiver.otlp "default" {
             grpc {
               endpoint = "0.0.0.0:4317"
             }
             http {
               endpoint = "0.0.0.0:4318"
             }
             output {
               traces  = [otelcol.processor.batch.default.input]
             }
           }

           otelcol.processor.batch "default" {
             timeout         = "5s"
             send_batch_size = 512
             output {
               traces = [otelcol.exporter.otlp.tempo.input]
             }
           }

           otelcol.exporter.otlp "tempo" {
             client {
               endpoint = "tempo.monitoring.svc.cluster.local:4317"
               tls {
                 insecure             = true
                 insecure_skip_verify = true
               }
             }
           }

      mounts:
        varlog: true
        dockercontainers: false

      extraEnv:
        - name: GOMEMLIMIT
          value: "384MiB"

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

    controller:
      type: daemonset
