alloy:
  image:
    repository: docker.io/grafana/alloy
    tag: v1.21.2
  configMap:
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "prometheus-node-exporter"
          action        = "drop"
        }
      }

      prometheus.scrape "kubernetes_pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [prometheus.remote_write.vm.receiver, prometheus.remote_write.openobserve.receiver]
      }

      prometheus.remote_write "vm" {
        endpoint {
          url = "http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write"
        }
      }

      prometheus.remote_write "openobserve" {
        endpoint {
          url = "http://openobserve-router.openobserve.svc.cluster.local:5080/api/default/prometheus/api/v1/write"
          basic_auth {
            username = "admin@frengky.xyz"
            password = "REPLACE_WITH_OPENOBSERVE_PASSWORD"
          }
        }
      }

      discovery.kubernetes "pods_logs" {
        role = "pod"
      }

      discovery.relabel "pods_logs" {
        targets = discovery.kubernetes.pods_logs.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      discovery.kubernetes "kube_state_metrics" {
        role = "service"
      }

      discovery.relabel "kube_state_metrics" {
        targets = discovery.kubernetes.kube_state_metrics.targets

        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex = "kube-state-metrics"
          action = "keep"
        }
      }

      prometheus.scrape "kube_state_metrics" {
        targets    = discovery.relabel.kube_state_metrics.output
        forward_to = [prometheus.remote_write.vm.receiver, prometheus.remote_write.openobserve.receiver]
      }

      discovery.kubernetes "nodes" {
        role = "node"
      }

      prometheus.scrape "kubelet" {
        targets           = discovery.kubernetes.nodes.targets
        scheme            = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        tls_config {
          insecure_skip_verify = true
        }

        forward_to = [prometheus.remote_write.vm.receiver, prometheus.remote_write.openobserve.receiver]
      }

      prometheus.scrape "cadvisor" {
        targets           = discovery.kubernetes.nodes.targets
        metrics_path      = "/metrics/cadvisor"
        scheme            = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        tls_config {
          insecure_skip_verify = true
        }

        forward_to = [prometheus.remote_write.vm.receiver, prometheus.remote_write.openobserve.receiver]
      }

      discovery.kubernetes "node_exporter" {
        role = "service"
      }

      discovery.relabel "node_exporter" {
        targets = discovery.kubernetes.node_exporter.targets

        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = ".*node-exporter.*"
          action        = "keep"
        }
      }

      prometheus.scrape "node_exporter" {
        targets    = discovery.relabel.node_exporter.output
        forward_to = [prometheus.remote_write.vm.receiver, prometheus.remote_write.openobserve.receiver]
      }

      loki.source.kubernetes "pods_logs" {
        targets    = discovery.relabel.pods_logs.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

  mounts:
    varlog: true
    dockercontainers: true

  extraEnv:
    - name: GOMEMLIMIT
      value: "384MiB"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

controller:
  type: daemonset
