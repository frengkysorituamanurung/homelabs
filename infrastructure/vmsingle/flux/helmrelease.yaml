apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmsingle
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.49.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  releaseName: vmsingle
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    server:
      image:
        registry: docker.io
        repository: victoriametrics/victoria-metrics
        tag: "v1.154.0"
        pullPolicy: Always
      retentionPeriod: 30d
      extraArgs:
        memory.allowedPercent: "40"
        search.maxQueryLen: "65536"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1536Mi
      persistentVolume:
        size: 10Gi
        storageClass: local-path
      service:
        type: ClusterIP
        clusterIP: "10.43.72.0"
        servicePort: 8428
