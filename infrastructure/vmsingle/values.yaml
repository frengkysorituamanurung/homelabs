server:
  image:
    registry: docker.io
    repository: victoriametrics/victoria-metrics
    tag: "v1.154.0"
    pullPolicy: Always
  retentionPeriod: 30d
  extraArgs:
    memory.allowedPercent: "40"
  persistentVolume:
    size: 10Gi
    storageClass: local-path
  service:
    type: LoadBalancer
    servicePort: 8428
