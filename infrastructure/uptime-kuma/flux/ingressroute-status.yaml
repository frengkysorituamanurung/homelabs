apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma-status
  namespace: uptime-kuma
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`status.frengky.xyz`) && Path(`/`)
      kind: Rule
      middlewares:
        - name: redirect-to-status
          namespace: uptime-kuma
      services:
        - name: uptime-kuma
          port: 3001
    - match: Host(`status.frengky.xyz`) && (PathPrefix(`/status`) || PathPrefix(`/assets`) || PathPrefix(`/upload`) || PathPrefix(`/api`) || PathPrefix(`/socket.io`))
      kind: Rule
      services:
        - name: uptime-kuma
          port: 3001
  tls: {}