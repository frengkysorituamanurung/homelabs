apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-admin-token
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: garage-admin-token
    creationPolicy: Owner
  data:
    - secretKey: admin-token
      remoteRef:
        key: secret/data/garage
        property: admin_token