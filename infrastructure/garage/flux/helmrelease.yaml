apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/charts/garage
      version: "0.10.3"
      sourceRef:
        kind: GitRepository
        name: homelabs
        namespace: flux-system
  releaseName: garage
  targetNamespace: garage
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Garage S3-compatible object storage (single-node)
    garage:
      dbEngine: "lmdb"
      blockSize: "1048576"
      replicationFactor: "1"
      singleNode: true
      consistencyMode: "consistent"
      compressionLevel: "1"
      rpcBindAddr: "[::]:3901"
      s3:
        api:
          bindAddr: "[::]:3900"
          region: "garage"
          rootDomain: ".s3.garage.frengky.xyz"
        web:
          bindAddr: "[::]:3902"
          rootDomain: ".web.garage.frengky.xyz"
          index: "index.html"
      admin:
        apiBindAddr: "[::]:3903"

    persistence:
      enabled: true
      meta:
        storageClass: "local-path"
        size: 1Gi
      data:
        storageClass: "local-path"
        size: 20Gi

    deployment:
      kind: StatefulSet
      replicaCount: 1
      podManagementPolicy: OrderedReady

    image:
      repository: dxflrs/amd64_garage
      tag: "v2.4.1"
      pullPolicy: Always

    environment:
      - name: GARAGE_ADMIN_TOKEN
        valueFrom:
          secretKeyRef:
            name: garage-admin-token
            key: admin-token

    service:
      type: ClusterIP
      admin:
        enabled: true

    ingress:
      s3:
        api:
          enabled: false
        web:
          enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    monitoring:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
