# ArgoCD Helm values
# TLS dihandle oleh Cloudflare Tunnel, ArgoCD berjalan dalam mode insecure

global:
  domain: argocd.frengky.xyz

configs:
  params:
    # Karena TLS diterminate di Cloudflare/Traefik level
    server.insecure: "true"
  cm:
    # Disable admin login via UI setelah SSO dikonfigurasi
    admin.enabled: "true"
    # Aktifkan apiKey untuk user admin
    accounts.admin: apiKey
    # URL untuk SSO callback (jika diaktifkan di masa depan)
    url: "https://argocd.frengky.xyz"
    # Repositories yang dipercaya
    # repositories: |

# Resource limits untuk single-node cluster
controller:
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
  extraArgs:
    - --status-processors=5
    - --operation-processors=5
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2048Mi

server:
  replicas: 1
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
  ingress:
    enabled: false
  extraArgs:
    - --insecure

repoServer:
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1024Mi

applicationSet:
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7000"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

notifications:
  enabled: false

