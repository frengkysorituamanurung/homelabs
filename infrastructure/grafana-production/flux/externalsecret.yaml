apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-telegram-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-telegram-credentials
    creationPolicy: Owner
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: secret/telegram
        property: botToken