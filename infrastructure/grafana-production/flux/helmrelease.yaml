apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-production
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  releaseName: grafana-production
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    admin:
      existingSecret: grafana-credentials
      userKey: admin-user
      passwordKey: admin-password

    image:
      registry: docker.io
      repository: grafana/grafana
      tag: "12.3.1"
      pullPolicy: Always

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

    persistence:
      enabled: true
      size: 5Gi
      storageClassName: local-path

    initChownData:
      enabled: true
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        capabilities:
          add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
          drop:
            - ALL

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: VictoriaMetrics
            type: prometheus
            access: proxy
            url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
            isDefault: true
            jsonData:
              httpMethod: POST
              timeInterval: "15s"
          - name: Loki
            uid: Loki
            type: loki
            access: proxy
            url: http://loki.monitoring.svc.cluster.local:3100
            jsonData:
              derivedFields:
                - datasourceUid: Tempo
                  matcherRegex: '"(?:trace_id|TraceId)":"([a-fA-F0-9]{16,32})"'
                  name: TraceID
                  url: "$${__value.raw}"
                  urlDisplayLabel: "Inspect Trace in Tempo"
          - name: Tempo
            uid: Tempo
            type: tempo
            access: proxy
            url: http://tempo.monitoring.svc.cluster.local:3200
            jsonData:
              tracesToLogsV2:
                datasourceUid: Loki
                spanStartTimeShift: "-2m"
                spanEndTimeShift: "2m"
                filterByTraceID: false
                filterBySpanID: false
                customQuery: true
                query: '{cluster="homelabs"} |= "$${__trace.traceId}"'
              tracesToMetrics:
                datasourceUid: VictoriaMetrics
                spanStartTimeShift: "-5m"
                spanEndTimeShift: "5m"
                tags:
                  - key: service.name
                    value: service
                queries:
                  - name: "Ingress Request Rate (RPS)"
                    query: 'sum(rate(traefik_service_requests_total[5m]))'
                  - name: "Ingress P95 Latency"
                    query: 'histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le))'
              serviceMap:
                datasourceUid: VictoriaMetrics
              nodeGraph:
                enabled: true
              search:
                hide: false
              lokiSearch:
                datasourceUid: Loki

    grafana.ini:
      analytics:
        check_for_updates: true
        reporting_enabled: false
      server:
        domain: grafana.frengky.xyz
        root_url: "https://grafana.frengky.xyz"
        enforce_domain: false
      dashboards:
        default_home_dashboard_path: /tmp/dashboards/Core Observability/homelab-home-dashboard.json

    envFromSecret: grafana-telegram-credentials

    service:
      type: ClusterIP
      port: 80

    ingress:
      enabled: false

    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true

    extraConfigmapMounts:
      - name: grafana-alerts-telegram
        configMap: grafana-alerts-telegram
        subPath: telegram-notifiers.yaml
        mountPath: /etc/grafana/provisioning/alerting/telegram-notifiers.yaml
        readOnly: true
      - name: grafana-alerts-cluster-rules
        configMap: grafana-alerts-cluster-rules
        subPath: cluster-rules.yaml
        mountPath: /etc/grafana/provisioning/alerting/cluster-rules.yaml
        readOnly: true
