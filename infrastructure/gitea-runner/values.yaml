enabled: true

giteaRootURL: http://gitea-http.gitea.svc.cluster.local:3000/

existingSecret: gitea-runner-token
existingSecretKey: token

global:
  storageClass: "local-path"

statefulset:
  replicas: 1
  persistence:
    size: 2Gi
  dind:
    tag: 24.0.9-dind
  runner:
    labels:
      - "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"
      - "ubuntu_latest:docker://catthehacker/ubuntu:act-latest"
      - "ubuntu-24.04:docker://catthehacker/ubuntu:act-24.04"
      - "ubuntu_24.04:docker://catthehacker/ubuntu:act-24.04"
      - "ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04"
      - "ubuntu_22.04:docker://catthehacker/ubuntu:act-22.04"
      - "ubuntu-20.04:docker://catthehacker/ubuntu:act-20.04"
      - "ubuntu_20.04:docker://catthehacker/ubuntu:act-20.04"
    config: |
      log:
        level: debug
      runner:
        capacity: 5
      cache:
        enabled: false
      container:
        require_docker: true
        docker_timeout: 300s
        force_pull: true
        # Map runs-on labels to real Docker images (support both hyphen and underscore)
        labels:
          - "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"
          - "ubuntu_latest:docker://catthehacker/ubuntu:act-latest"
          - "ubuntu-24.04:docker://catthehacker/ubuntu:act-24.04"
          - "ubuntu_24.04:docker://catthehacker/ubuntu:act-24.04"
          - "ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04"
          - "ubuntu_22.04:docker://catthehacker/ubuntu:act-22.04"
          - "ubuntu-20.04:docker://catthehacker/ubuntu:act-20.04"
          - "ubuntu_20.04:docker://catthehacker/ubuntu:act-20.04"
