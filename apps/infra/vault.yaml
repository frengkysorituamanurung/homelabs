apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: harbor.frengky.xyz
      chart: helm-repos/vault
      targetRevision: "0.29.1"
      helm:
        valueFiles:
          - $values/charts/infra/vault/values.yaml
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/frengky/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
