apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: harbor.frengky.xyz
      chart: helm-repos/argo-cd
      targetRevision: "7.8.23"
      helm:
        valueFiles:
          - $values/charts/infra/argocd/values.yaml
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/frengky/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
