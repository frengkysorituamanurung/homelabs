apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-middleware
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/frengky/gitops.git
    targetRevision: main
    path: manifests/vpn-middleware
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
