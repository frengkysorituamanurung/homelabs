generic-app:
  baseNamespace: frontend
  baseName: hello-world
  environment: production
  refreshInterval: "10s"
  image:
    repository: harbor.frengky.xyz/frontend/hello-world
    tag: "1.0.0"
    pullPolicy: Always
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 80
  ingress:
    enabled: true
    stripPath: false
    hosts:
      - host: hello.frengky.xyz
        path: /
        port: 80

# optimized CI run - test gitea sync
