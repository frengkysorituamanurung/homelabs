generic-app:
  replicaCount: 1
  environment: "staging"
  
  image:
    repository: harbor.frengky.xyz/frontend/hello-world
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    hosts:
      - host: service-a-staging.frengky.xyz
        path: /
        port: 80

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
