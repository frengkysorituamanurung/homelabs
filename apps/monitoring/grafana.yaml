apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: harbor-core.harbor.svc.cluster.local
      chart: helm-repos/grafana
      targetRevision: "8.10.4"
      helm:
        valueFiles:
          - $values/charts/monitoring/grafana/values.yaml
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/frengky/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
