apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 5m
  path: ./infrastructure/harbor/flux
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelabs
  timeout: 10m
