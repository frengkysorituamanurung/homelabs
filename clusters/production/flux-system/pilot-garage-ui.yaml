apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage-ui
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 5m
  path: ./infrastructure/garage-ui/flux
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelabs
  timeout: 5m
