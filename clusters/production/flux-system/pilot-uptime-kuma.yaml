apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 5m
  path: ./infrastructure/uptime-kuma/flux
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelabs
  timeout: 5m