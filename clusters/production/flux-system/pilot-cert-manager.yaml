apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 10m
  path: ./infrastructure/cert-manager
  prune: false
  wait: false
  sourceRef:
    kind: GitRepository
    name: homelabs
  timeout: 10m
