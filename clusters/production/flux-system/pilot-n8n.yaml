apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 10m
  path: ./k8s/clusters/production/applications/apps/production/n8n
  prune: false
  wait: true
  targetNamespace: n8n
  sourceRef:
    kind: GitRepository
    name: homelabs
  timeout: 5m
