---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-rollouts
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 10m
  path: ./infrastructure/argo-rollouts
  prune: false
  wait: false
  targetNamespace: argo-rollouts
  sourceRef:
    kind: GitRepository
    name: homelabs
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-rules
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 10m
  path: ./infrastructure/ingress
  prune: false
  wait: false
  sourceRef:
    kind: GitRepository
    name: homelabs
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-unsealer
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 10m
  path: ./infrastructure/vault-unsealer
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelabs
  timeout: 5m
