{{- $values := index .Values "main-app" | default .Values -}}
{{- if not $values.disableSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $values.baseName | default .Chart.Name }}-secrets
  namespace: {{ $values.baseNamespace | default .Release.Namespace }}
spec:
  refreshInterval: "10s"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: {{ $values.baseName | default .Chart.Name }}-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ printf "%s/%s/%s" ($values.environment | default "production") ($values.baseNamespace | default .Release.Namespace) ($values.baseName | default .Chart.Name) }}
{{- end }}
