{{- $values := index .Values "main-app" | default .Values -}}
{{- if and $values.autoscaling $values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $values.baseName | default (include "generic-app.fullname" .) }}
  namespace: {{ $values.baseNamespace | default .Release.Namespace }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: {{ if and $values.deploymentStrategy (eq $values.deploymentStrategy.type "BlueGreen") }}argoproj.io/v1alpha1{{ else }}apps/v1{{ end }}
    kind: {{ if and $values.deploymentStrategy (eq $values.deploymentStrategy.type "BlueGreen") }}Rollout{{ else }}Deployment{{ end }}
    name: {{ $values.baseName | default (include "generic-app.fullname" .) }}
  minReplicas: {{ $values.autoscaling.minReplicas }}
  maxReplicas: {{ $values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $values.autoscaling.targetMemory }}
{{- end }}
