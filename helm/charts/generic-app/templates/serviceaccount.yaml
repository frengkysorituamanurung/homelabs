{{- $values := index .Values "main-app" | default .Values -}}
{{- if and $values.serviceAccount $values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $values.serviceAccount.name | default (include "generic-app.fullname" .) }}
  namespace: {{ $values.baseNamespace | default .Release.Namespace }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
  {{- with $values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
