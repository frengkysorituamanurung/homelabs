# Default values for generic-app.
replicaCount: 1

image:
  repository: harbor.frengky.xyz/frontend/hello-world
  pullPolicy: IfNotPresent
  tag: ""

baseName: ""
baseNamespace: ""
environment: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

configData:
  enabled: false
  data: {}

service:
  type: ClusterIP
  port: 80
  ports: []

ingress:
  enabled: false
  stripPath: false
  hosts:
    - host: hello.frengky.xyz
      path: /
      port: 80

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

healthCheck:
  enabled: false
  endpoint: /
  port: 80
