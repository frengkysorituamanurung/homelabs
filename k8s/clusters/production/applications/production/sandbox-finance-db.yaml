apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-finance-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/frengkysorituamanurung/homelabs.git
    path: k8s/clusters/production/applications/apps/production/database/sandbox-finance
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
