apiVersion: v1
kind: Service
metadata:
  name: ckx-cluster
  namespace: ckx
  labels:
    app: ckx-cluster
spec:
  selector:
    app: ckx-cluster
  ports:
    - name: kube-api
      port: 6443
      targetPort: 6443
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: jumphost
  namespace: ckx
  labels:
    app: ckx-jumphost
spec:
  selector:
    app: ckx-jumphost
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
