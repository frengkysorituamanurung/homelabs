apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ckx
  namespace: ckx
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: ckx.frengky.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ckx
                port:
                  number: 80