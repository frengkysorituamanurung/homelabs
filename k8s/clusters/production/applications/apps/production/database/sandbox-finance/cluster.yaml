apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sandbox-finance
  namespace: database
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:17.5

  storage:
    size: 5Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  bootstrap:
    initdb:
      database: sandbox_finance
      owner: sandbox_user
      secret:
        name: sandbox-finance-credentials

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "64MB"
      log_min_duration_statement: "1000"
