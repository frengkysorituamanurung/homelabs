apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sandbox-finance-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: sandbox-finance-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/sandbox-finance
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/sandbox-finance
        property: password
