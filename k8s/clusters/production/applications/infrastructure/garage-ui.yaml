apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://github.com/frengkysorituamanurung/homelabs.git
      targetRevision: main
      path: helm/charts/garage-ui
      helm:
        valueFiles:
          - $values/infrastructure/garage-ui/values.yaml
    - repoURL: https://github.com/frengkysorituamanurung/homelabs.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true