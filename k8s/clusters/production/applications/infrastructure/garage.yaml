apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://git.deuxfleurs.fr/Deuxfleurs/garage.git
      targetRevision: v2.4.1
      path: script/helm/garage
      helm:
        valueFiles:
          - $values/infrastructure/garage/values.yaml
    - repoURL: https://github.com/frengkysorituamanurung/homelabs.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/frengkysorituamanurung/homelabs.git
      targetRevision: main
      path: infrastructure/garage/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true