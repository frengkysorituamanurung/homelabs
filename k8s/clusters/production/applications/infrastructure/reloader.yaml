apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: "2.2.18"
    helm:
      parameters:
        - name: reloader.deployment.image.name
          value: "ghcr.io/stakater/reloader"
        - name: reloader.deployment.image.tag
          value: "v1.4.22"
        - name: reloader.autoReloadAll
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
