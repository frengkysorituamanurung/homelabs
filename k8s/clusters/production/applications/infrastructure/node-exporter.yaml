apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-node-exporter
    targetRevision: "4.60.0"
    helm:
      parameters:
        - name: image.registry
          value: "quay.io"
        - name: image.repository
          value: "prometheus/node-exporter"
        - name: image.tag
          value: "v1.12.1"
    helm:
      valuesObject:
        tolerations:
          - operator: "Exists"
        hostRootFsMount:
          enabled: false
          mountPropagation: "None"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
