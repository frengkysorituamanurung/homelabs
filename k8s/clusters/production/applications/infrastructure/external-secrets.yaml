apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: harbor-registry-tls.harbor.svc.cluster.local
    chart: helm-repos/external-secrets
    targetRevision: "2.14.0"
    helm:
      parameters:
        - name: installCRDs
          value: "false"
        - name: webhook.enabled
          value: "true"
        - name: certController.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
