apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: harbor-registry-tls.harbor.svc.cluster.local
    chart: helm-repos/prometheus-node-exporter
    targetRevision: "4.45.0"
    helm:
      valuesObject:
        tolerations:
          - operator: "Exists"
        hostRootFsMount:
          enabled: false
          mountPropagation: "None"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
